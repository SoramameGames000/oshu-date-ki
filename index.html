/* ================= 全国勢力図 ================= */
const JP_=(lat,lon)=>[(lon-JLON0)*JKX,(JLAT0-lat)*JKY];
const jpathD=(arr,close)=>arr.map(([a,o],i)=>{const [x,y]=JP_(a,o);return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);}).join('')+(close?'Z':'');
function curPhase(){let ph=JP_PHASES[0];JP_PHASES.forEach(x=>{if(now()>=dnum(x.from[0],x.from[1]))ph=x;});return ph;}
function jpStatic(){return curPhase().fac.filter(f=>!(f.link&&FA(f.link)&&!FA(f.link).alive));}
function jpFind(id){return jpStatic().find(f=>f.id===id);}
function jpName(f){return f.link&&FA(f.link)?FA(f.link).name:f.name;}
function jpLeader(f){if(f.link==='toyotomi')return OF('hideyoshi').name;return f.leader;}
function liveFacs(){return Object.values(G.factions).filter(f=>f.alive&&!f.central&&facCastles(f.id).length);}
function liveCenter(fid){const cs=facCastles(fid);return [cs.reduce((t,c)=>t+c.lat,0)/cs.length,cs.reduce((t,c)=>t+c.lon,0)/cs.length];}
function tierOf(koku){return koku<15?'小勢力':koku<50?'中勢力':koku<150?'大勢力':'巨大勢力';}
function isLive(id){return !!(FA(id)&&!FA(id).central&&FA(id).alive&&facCastles(id).length);}
function jpCenter(id){if(isLive(id))return liveCenter(id);const f=jpFind(id);return f?[f.pts[0][0],f.pts[0][1]]:null;}
function jpWarsNow(){
  const n=now();const out=[];
  JP_WARS.forEach(w=>{if(n>=dnum(w[2][0],w[2][1])&&n<=dnum(w[3][0],w[3][1])&&jpCenter(w[0])&&jpCenter(w[1]))out.push([w[0],w[1],w[4]]);});
  Object.values(G.factions).forEach(f=>{if(f.alive&&f.war&&jpCenter(f.id))out.push([PLAYER,f.id,'伊達家との戦']);});
  G.aiWars.forEach(([a,b])=>{if(isLive(a)&&isLive(b))out.push([a,b,'奥羽の抗争']);});
  return out;
}
function isKnown(id){if(isLive(id))return true;const f=jpFind(id);if(f&&f.link&&FA(f.link)&&(FA(f.link).ally||FA(f.link).marriage))return true;return (G.intel[id]||0)>=now();}
function buildJapan(){
  let s=`<defs><pattern id="wave" width="28" height="14" patternUnits="userSpaceOnUse"><path d="M0 9 Q7 3 14 9 T28 9" class="wave"/></pattern></defs>
   <rect x="-400" y="-400" width="${JMAP_W+800}" height="${JMAP_H+800}" class="sea"/><rect x="-400" y="-400" width="${JMAP_W+800}" height="${JMAP_H+800}" fill="url(#wave)"/>`;
  JP_LAND.forEach(p=>s+=`<path d="${jpathD(p,true)}" class="jland"/>`);
  let [x,y]=JP_(33.3,139.6);s+=`<text x="${x}" y="${y}" class="seaT">太平洋</text>`;[x,y]=JP_(39.2,135.6);s+=`<text x="${x}" y="${y}" class="seaT">日本海</text>`;
  s+=`<g id="jWar"></g><g id="jFac"></g><g id="jReg"></g>`;
  $('#map').innerHTML=s;
  $('#jReg').innerHTML=JP_REGIONS.map(([n,a,o])=>{const [x,y]=JP_(a,o);return `<text x="${x}" y="${y}" class="regT">${n}</text>`;}).join('');
}
function renderJapan(){
  if(!$('#jFac'))return;
  let s='';
  jpStatic().forEach(f=>{const [x,y]=JP_(f.pts[0][0],f.pts[0][1]);
    s+=`<g class="jf" data-jf="${f.id}">${f.pts.map(p=>{const [px,py]=JP_(p[0],p[1]);return `<circle class="blob" cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${(p[2]*JKY*0.75).toFixed(1)}" fill="${f.color}"/>`;}).join('')}<text x="${x}" y="${y+4}" class="jn">${jpName(f).replace(/家$/,'')}</text></g>`;});
  liveFacs().forEach(F=>{const me=F.id===PLAYER;const cs=facCastles(F.id);const [la,lo]=liveCenter(F.id);const [x,y]=JP_(la,lo);
    s+=`<g class="jf ${me?'me':''}" data-lf="${F.id}">${cs.map(c=>{const [px,py]=JP_(c.lat,c.lon);return `<circle class="blob" cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${me?6:5}" fill="${F.color}"/>`;}).join('')}${me||cs.length>=3?`<text x="${x}" y="${y+4}" class="jn">${F.short}</text>`:''}</g>`;});
  $('#jFac').innerHTML=s;
  $('#jWar').innerHTML=jpWarsNow().map(([a,b])=>{const A=jpCenter(a),B=jpCenter(b);const [x1,y1]=JP_(A[0],A[1]),[x2,y2]=JP_(B[0],B[1]);return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="jwar"/>`;}).join('');
}
function jpFacModal(id,live){
  const wars=jpWarsNow().filter(w=>w[0]===id||w[1]===id).map(w=>{const o=w[0]===id?w[1]:w[0];return `${jpDisplayName(o)}（${w[2]}）`;});
  const note='<div class="note">勢力図は簡略化したもの。所領規模・動員力はゲーム上の目安。</div>';
  if(live){
    const F=FA(id);const cs=facCastles(id);const koku=kokudaka(id)/10000;
    modal(F.name,`<div class="kv"><div><span>大名</span><b>${leaderName(id)}</b></div><div><span>所領規模</span><b>約${koku.toFixed(1)}万石</b></div><div><span>軍事力</span><b>${id===PLAYER?'兵 '+fmt(facTroops(id)):facTroopsShown(id)}</b></div><div><span>外交</span><b>${id===PLAYER?'自家':relStage(id)[0]}</b></div></div>
     <div class="evtext" style="font-size:15px"><b>領地：</b>${cs.map(c=>c.place).join('・')}<br><b>戦争中：</b>${wars.join('、')||'なし'}</div>${note}`,
     [{label:'東北マップで見る',on:()=>{hideModal();setMapMode('tohoku');}}].concat(id!==PLAYER?[{label:'外交する',cls:'pri',on:()=>diploModal(id)}]:[]));
    return;
  }
  const f=jpFind(id);if(!f)return;const kn=isKnown(id);const L=f.link&&FA(f.link);
  const rel=L&&L.alive?`${relStage(f.link)[0]}（関係値 ${Math.round(L.rel)}）`:'直接の交渉なし（遠国）';
  modal(jpName(f),`<div class="kv"><div><span>大名</span><b>${jpLeader(f)}</b></div><div><span>所領規模</span><b>${kn?`約${f.koku}万石`:tierOf(f.koku)}</b></div><div><span>軍事力の目安</span><b>${kn?`動員 約${(f.koku*0.025).toFixed(1)}万人`:tierOf(f.koku)+'（詳細不明）'}</b></div><div><span>外交</span><b>${rel}</b></div></div>
   <div class="evtext" style="font-size:15px"><b>領地：</b>${f.prov}<br><b>戦争中：</b>${wars.join('、')||'なし'}<br><b>情報：</b>${kn?(G.intel[id]?`詳しい情報あり（${Math.floor((G.intel[id])/12)}年${G.intel[id]%12+1}月まで）`:'詳しい情報あり'):'<span style="color:var(--warn)">情報不足。情報収集で詳しく分かる</span>'}</div>${note}`,
   [{label:'一覧へ',on:jpListModal}].concat(!kn?[{label:'情報収集（金100・行動1回）',cls:'kon',disabled:G.ap<=0||FA(PLAYER).gold<100,on:()=>{FA(PLAYER).gold-=100;useAP();G.intel[id]=now()+12;log(`${jpName(f)}の内情を探らせた`,'外');autosave(true);toast('情報を集めた');renderAll();jpFacModal(id,false);}}]:[]).concat(L&&L.alive?[{label:'外交する',cls:'pri',on:()=>diploModal(f.link)}]:[]));
}
function jpDisplayName(id){if(isLive(id))return FA(id).name;const f=jpFind(id);return f?jpName(f):(FA(id)?FA(id).name:id);}
function jpListModal(){
  const ph=curPhase();const wars=jpWarsNow();const inWar=id=>wars.some(w=>w[0]===id||w[1]===id);
  const rows=jpStatic().map(f=>({id:f.id,live:false,name:jpName(f),koku:f.koku,color:f.color,kn:isKnown(f.id),rel:f.link&&FA(f.link)&&FA(f.link).alive?relStage(f.link):null}))
   .concat(liveFacs().map(F=>({id:F.id,live:true,name:F.name,koku:kokudaka(F.id)/10000,color:F.color,kn:true,rel:F.id===PLAYER?['自家','ally']:relStage(F.id)})))
   .sort((a,b)=>b.koku-a.koku);
  modal(`全国の勢力（${eraName(G.year)}）`,`<div class="note">${ph.note}</div>`+rows.map(r=>`<button class="row" data-id="${r.id}" data-live="${r.live?1:0}"><span class="dotc" style="background:${r.color}"></span><span class="grow"><span class="nm">${r.name}</span> ${inWar(r.id)?'<span class="badge war">戦争中</span>':''}${r.rel?`<span class="badge ${r.rel[1]}">${r.rel[0]}</span>`:''}<div class="meta">${r.kn?`約${r.koku.toFixed(r.koku<10?1:0)}万石（目安）`:tierOf(r.koku)+'（情報不足）'}</div></span></button>`).join(''),[]);
  document.querySelectorAll('#mBody [data-id]').forEach(b=>b.onclick=()=>jpFacModal(b.dataset.id,b.dataset.live==='1'));
}

UI.mapMode='tohoku';UI.vbs={};
function defaultVB(m){
  if(m==='japan'){const [x1,y1]=JP_(42.2,129.4),[x2,y2]=JP_(30.9,142.6);return {x:x1,y:y1,w:x2-x1,h:y2-y1};}
  const [lo1,lo2,la1,la2]=VIEWS.south;const [x1,y1]=P_(la2,lo1),[x2,y2]=P_(la1,lo2);return {x:x1,y:y1,w:x2-x1,h:y2-y1};

function zoomBy(f,cx,cy){const v=UI.vb;if(cx==null){cx=v.x+v.w/2;cy=v.y+v.h/2;}const [mn,mx]=UI.mapMode==='japan'?[90,JMAP_W*1.3]:[140,MAP_W*1.2];const nw=clamp(v.w*f,mn,mx);const k=nw/v.w;v.x=cx-(cx-v.x)*k;v.y=cy-(cy-v.y)*k;v.w=nw;v.h*=k;applyVB();}

  const svg=$('#map');let down=null;

  svg.addEventListener('pointermove',e=>{if(!down||down.id!==e.pointerId)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;
    if(!down.drag&&Math.hypot(dx,dy)>8){down.drag=true;svg.classList.add('drag');try{svg.setPointerCapture(e.pointerId);}catch(_){}}
    if(UI.pinch){down=null;return;}

  svg.addEventListener('pointercancel',()=>{down=null;svg.classList.remove('drag');});
  svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();const s=mapScale();const v=UI.vb;
    const cx=v.x+(e.clientX-r.left-(r.width-v.w/s)/2)*s,cy=v.y+(e.clientY-r.top-(r.height-v.h/s)/2)*s;zoomBy(e.deltaY>0?1.15:0.87,cx,cy);},{passive:false});

function upMult(c,cat){let m=1;const t=ctype(c);
  if(cat==='agri'){if(ctag(c,'穀倉'))m*=1.3;if(season()==='春')m*=1.2;}
  if(cat==='comm'){if(ctag(c,'港'))m*=1.3;if(t==='平城')m*=1.2;if(t==='山城')m*=0.7;}

  if(k.id==='agri')return `米収入＋10%${extra}`;if(k.id==='comm')return `金収入＋10%${extra}`;return `防御力＋10%（修復込み）${extra}`;};
doUpgrade=function(c,cat){
  const lv=c.lv[cat];const cost=LV_COST[lv];const m=(1+roleBonus(cat)/100)*upMult(c,cat);const P=FA(PLAYER);

  if(cat==='comm'){const inc=Math.max(3,Math.round(c.b.comm*0.1*m));c.commMax+=inc;c.comm=Math.min(c.commMax,c.comm+inc);c.road=Math.min(100,c.road+10);}

function townTier(c){const lv=c.lv?c.lv.agri+c.lv.comm+c.lv.castle+c.lv.order:4;const pt=c.pop>=25000?3:c.pop>=15000?2:1;const dt=lv>=16?4:lv>=12?3:lv>=8?2:1;let t=Math.max(pt,dt);if(t===4&&!(dt>=4&&c.pop>=22000))t=3;return t;}

   const msg=`${c.name}の城下が「${TOWN[from-1]}」から「${TOWN[t-1]}」へ発展した（金収入・人口・兵站が向上）`;log(msg,'政');if(t>=3)hist(msg,false);if(announce)toast(msg);else G.queue.push({k:'notice',title:'城下の発展',text:msg+'。'});}else if(t>c.town)c.town=t;}

const ROAD_NAMES={'omori|shiroishi':'奥州街道','shiroishi|iwanuma':'奥州街道','iwanuma|chiyo':'奥州街道','omori|nihonmatsu':'奥州街道','sukagawa|shirakawa':'奥州街道','nihonmatsu|miharu':'奥州街道（本宮筋）','yonezawa|yamagata':'羽州街道','yonezawa|omori':'板谷越え','shiroishi|yamagata':'七ヶ宿街道','chiyo|yamagata':'笹谷越え','yonezawa|inawashiro':'檜原越え','sukagawa|kurokawa':'勢至堂越え','inawashiro|kurokawa':'会津道','nihonmatsu|inawashiro':'母成越え','chiyo|takamori':'奥州街道','takamori|myou':'奥州街道'};
function roadName(a,b){return ROAD_NAMES[a+'|'+b]||ROAD_NAMES[b+'|'+a]||({m:'山道（峠越え）',p:'脇街道',r:'川沿いの道'}[edgeType(a,b)]);}
function distKm(a,b){const A=CS(a),B=CS(b);const R=6371,dl=(B.lat-A.lat)*Math.PI/180,dn=(B.lon-A.lon)*Math.PI/180;const x=Math.sin(dl/2)**2+Math.cos(A.lat*Math.PI/180)*Math.cos(B.lat*Math.PI/180)*Math.sin(dn/2)**2;return Math.round(R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))*1.25);}
function marchDays(a,b){const t=edgeType(a,b);let sp={p:22,r:18,m:12}[t];const s=season();if(s==='冬')sp*=t==='m'?0.4:0.6;if(s==='夏'&&G.weather==='雨')sp*=0.85;

  return Math.ceil(distKm(a,b)/sp)+2;}

function situation(){const P=FA(PLAYER);const cons=monthlyRice();const atk=bestAttack();const th=threats();
  const bad=Object.values(G.factions).filter(f=>f.alive&&!f.central&&!f.war&&!f.ally&&f.rel<=-20&&adjacentToPlayer(f.id)).sort((a,b)=>a.rel-b.rel)[0];
  const lowO=facOfficers(PLAYER,true).filter(o=>o.loy<45&&o.id!==P.leader);
  const ally=Object.values(G.factions).filter(f=>f.alive&&!f.central&&!f.war&&!f.ally&&f.rel>=35).sort((a,b)=>b.rel-a.rel)[0];
  return {riceShort:P.rice<cons*4&&G.month!==9,goldShort:P.gold<300,atk:atk&&atk.r>=1.4?atk:null,th:th[0],bad,lowO,ally,toyo:alive('toyotomi')&&G.year>=1587&&!G.flags.sanjin&&FA('toyotomi').rel<20,winter:season()==='冬'};}

  switch(t){
   case '攻撃的':
    if(s.atk&&!s.winter)return {q:`敵は弱っております。今こそ${s.atk.t.name}を攻めるべきです！`,a:atkA};
    if(s.th)return {q:`${FA(s.th.e.owner).short}が来るなら打って出るまで。兵を集めましょうぞ。`,a:A('兵を募る',()=>gunjiModal('recruit',{c:s.th.c.id}))};
    if(s.winter)return {q:'雪が解ければ戦の季節。今のうちに兵を鍛えておくべきかと。',a:A('兵を訓練する',()=>gunjiModal('train'))};
    return {q:'兵を鍛え、来たる戦に備えるべきかと存じます。',a:A('兵を訓練する',()=>gunjiModal('train'))};
   case '慎重':
    if(s.riceShort)return {q:'兵糧が心許のうございます。まずは田畑を整えるべきかと。',a:A('農業を見る',()=>naiseiModal(cap))};
    if(s.th)return {q:`${s.th.c.name}の守りが手薄です。城を固めるのが先決かと。`,a:A('城を強化する',()=>naiseiModal(s.th.c.id))};
    if(s.atk)return {q:`${s.atk.t.name}は落とせましょうが、深追いは禁物。兵糧を十分に整えてからになさいませ。`,a:A('財政を確かめる',()=>hyojoModal())};
    return {q:'殿、今は戦より国力を整えるべきかと。',a:A('内政を見る',()=>naiseiModal(u?u.c.id:cap))};
   case '外交型':

    if(s.bad)return {q:`${s.bad.name}との間が冷えております。贈り物で和らげておきましょう。`,a:A(`${s.bad.short}と外交`,()=>diploModal(s.bad.id,o.id))};

    return {q:'敵を増やさぬことこそ肝要。周りの家の内情を探っておきましょう。',a:A('諜報を開く',()=>intelModal('faction'))};
   case '内政型':
    if(s.goldShort)return {q:'蔵が寂しゅうございます。商いを盛んにして金を集めましょう。',a:A('商業を見る',()=>naiseiModal(cap))};
    if(u)return {q:`${u.c.name}の${u.name}を整えれば、金も人も集まりましょう。`,a:A('内政を見る',()=>naiseiModal(u.c.id))};
    return {q:'城下はよく治まっております。この勢いを保ちましょう。',a:A('評定を見る',()=>hyojoModal())};
   case '野心的':
    if(s.atk)return {q:`好機を逃してはなりませぬ。${s.atk.t.name}を取り、奥州に覇を唱えましょう。`,a:atkA};
    if(G.prestige<45)return {q:'今の伊達家の威勢では、家中もついてまいりませぬぞ。',a:A('出陣を考える',()=>gunjiModal('attack'))};
    return {q:'奥州だけで満足してはなりませぬ。天下の情勢を見ておきましょう。',a:A('全国の勢力図',()=>{hideModal();setMapMode('japan');jpListModal();})};
   default:
    if(s.lowO.length)return {q:`家中の結束が乱れております。${s.lowO[0].name}殿に恩賞を。`,a:A('武将を見る',()=>officerModal(s.lowO[0].id))};
    return {q:'殿のご判断に従いまする。ただ、民を労わることもお忘れなく。',a:A('治安を見る',()=>naiseiModal(cap))};
  }
}
function opinions(){
  const L=FA(PLAYER).leader;const s=situation();
  const pool=facOfficers(PLAYER,true).filter(o=>o.id!==L&&!(o.away&&o.away>now())).sort((a,b)=>(b.int+b.pol+b.lea)-(a.int+a.pol+a.lea));
  const seen=new Set();const out=[];
  for(const o of pool){const t=trait(o);if(seen.has(t))continue;seen.add(t);const op=opinionFor(o,s);if(op&&op.a)out.push(Object.assign({o},op));if(out.length>=3)break;}

/* ---------- 災害・季節イベント ---------- */
function avgFlood(){const cs=facCastles(PLAYER);return cs.length?cs.reduce((t,c)=>t+c.flood,0)/cs.length:0;}
randomEvents=function(){
  const pcs=facCastles(PLAYER);if(!pcs.length)return;const cool=(G.flags.disCool||0)>now();const fl=avgFlood();
  if(G.month===8&&!G.flags['harv'+G.year]){G.flags['harv'+G.year]=1;const r=Math.random();
    if(r<0.09){G.harvestMod=Math.min(0.85,0.6+fl/400);G.flags.badMod=G.harvestMod;G.flags.badHarvest=G.year;G.flags.disCool=now()+3;G.queue.push({k:'notice',type:'ランダム',title:'凶作（やませの冷害）',text:`冷たい東風が続き、稲の育ちが悪い。今年の収穫は大きく減りそうだ（見込み ${Math.round(G.harvestMod*100)}%）。<br>治水を進めた城ほど被害が小さい。`});}
    else if(r<0.15&&!cool){G.harvestMod=Math.min(0.9,0.72+fl/500);G.flags.badMod=G.harvestMod;G.flags.badHarvest=G.year;G.flags.disCool=now()+3;G.queue.push({k:'notice',type:'ランダム',title:'旱魃',text:`日照りが続き、田の水が足りない。収穫が減りそうだ（見込み ${Math.round(G.harvestMod*100)}%）。<br>治水（用水）が整った城ほど被害が小さい。`});}
    else if(r<0.28){G.harvestMod=1.25;G.queue.push({k:'notice',type:'ランダム',title:'豊作の兆し',text:'天候に恵まれ、稲穂がよく実っている。今年は豊作になりそうだ。'});}}
  if(!cool){
    if(season()==='夏'&&Math.random()<0.1){const c=pick(pcs);if(Math.random()*100>c.flood){G.queue.push({k:'minor',id:'flood',data:{c:c.id}});G.flags.disCool=now()+4;}}
    else if(season()==='冬'&&Math.random()<0.035){const c=pick(pcs);const k=1-(c.lv.order-1)*0.15;const loss=Math.max(1,Math.round(c.comm*0.08*k));c.comm=Math.max(5,c.comm-loss);const g=Math.round(FA(PLAYER).gold*0.08*k);FA(PLAYER).gold-=g;c.loy=Math.max(0,c.loy-3);G.flags.disCool=now()+4;
      G.queue.push({k:'notice',type:'ランダム',title:'火災',text:`乾いた冬の風にあおられ、${c.name}の城下で火事が起きた。商業 −${loss}、金 −${fmt(g)}。<br>治安のレベルが高いほど被害は小さくなる。`});}
    else if(season()==='春'&&Math.random()<0.025){const c=pick(pcs);c.pop=Math.round(c.pop*0.93);c.loy=Math.max(0,c.loy-4);G.flags.disCool=now()+4;G.queue.push({k:'notice',type:'ランダム',title:'疫病',text:`${c.name}の城下で疫病が流行し、人口が減った。`});}
  }
  if(G.month===10&&G.flags.badHarvest===G.year&&!G.flags['famine'+G.year]&&(G.flags.badMod<0.75||FA(PLAYER).rice<monthlyRice()*4)){G.flags['famine'+G.year]=1;G.queue.push({k:'minor',id:'famine',data:{}});}
  const po=POOL_OFFER.find(([id,y])=>{const o=OF(id);return o&&o.alive&&o.fac==='pool'&&G.year>=y;});
  if(po&&Math.random()<0.15)G.queue.push({k:'minor',id:'recruit',data:{o:po[0]}});

function portraitKeys(o){const k=PORTRAIT_KEY[o.id];const out=[];if(o.id==='masamune'&&ageOf(o)&&ageOf(o)<=20)out.push('date_masamune_young');if(k)out.push(k);return out;}

function naiseiRecs(c){
  const P=FA(PLAYER);const out=[];const add=(cat,why)=>{if(c.lv[cat]<5&&!out.some(x=>x.cat===cat))out.push({cat,why});};
  if(P.rice<monthlyRice()*4&&G.month!==9)add('agri','米が不足している');
  if(c.loy<45)add('order','民忠が低い');
  if(neighbors(c.id).some(n=>{const o=CS(n).owner;return o!==PLAYER&&FA(o).war;})&&c.lv.castle<3)add('castle','敵と接する前線の城');
  if(P.gold<400)add('comm','金が少ない');
  if(ctag(c,'穀倉'))add('agri','穀倉地帯（農業の効果が大きい）');
  if(ctag(c,'港'))add('comm','港町（商業の効果が大きい）');
  if(ctype(c)==='山城')add('castle','山城（城強化の効果が大きい）');
  if(season()==='春')add('agri','春は農業の効果 ＋20%');
  const lowest=['agri','comm','order','castle'].sort((a,b)=>c.lv[a]-c.lv[b])[0];add(lowest,'いちばん遅れている項目');
  return out.slice(0,2);
}

/* ピンチズーム（iPhone） */
function bindPinch(){
  const svg=$('#map');let st=null;
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  svg.addEventListener('touchstart',e=>{if(e.touches.length===2){UI.pinch=true;st={d:dist(e.touches),vb:Object.assign({},UI.vb)};}},{passive:true});
  svg.addEventListener('touchmove',e=>{if(!st||e.touches.length!==2)return;e.preventDefault();const r=svg.getBoundingClientRect();const k=st.d/Math.max(1,dist(e.touches));
    const mx=(e.touches[0].clientX+e.touches[1].clientX)/2-r.left,my=(e.touches[0].clientY+e.touches[1].clientY)/2-r.top;
    const v=st.vb;const s=Math.max(v.w/r.width,v.h/r.height);const cx=v.x+(mx-(r.width-v.w/s)/2)*s,cy=v.y+(my-(r.height-v.h/s)/2)*s;
    const [mn,mxw]=UI.mapMode==='japan'?[90,JMAP_W*1.3]:[140,MAP_W*1.2];const nw=clamp(v.w*k,mn,mxw);const f=nw/v.w;
    UI.vb.x=cx-(cx-v.x)*f;UI.vb.y=cy-(cy-v.y)*f;UI.vb.w=nw;UI.vb.h=v.h*f;applyVB();},{passive:false});
  const end=e=>{if(e.touches.length<2){st=null;setTimeout(()=>{UI.pinch=false;},60);}};
  svg.addEventListener('touchend',end);svg.addEventListener('touchcancel',end);
  svg.addEventListener('gesturestart',e=>e.preventDefault());
}

/* =========================================================
   兵士募集の修正
   旧仕様の不具合：1人募兵するごとに人口を5人減らしていたため、数回で人口が下限（1000）まで落ち、
   民忠低下で人口も回復せず、「人口が募兵数×5以上」という条件を永久に満たせなくなっていた。
   新仕様：人口1人＝兵1人。城ごとに「兵力上限」と「今月の徴兵上限（毎月リセット）」を設け、理由を表示する。
   ========================================================= */
const RECRUIT_GOLD=0.4, RECRUIT_RICE=0.3;
function num(v,d){return (typeof v==='number'&&isFinite(v))?v:d;}
function repairCastle(c){c.pop=num(c.pop,Math.round(num(c.popMax,15000)/1.5));c.popMax=num(c.popMax,Math.round(c.pop*1.5));c.troops=Math.max(0,num(c.troops,0));c.loy=clamp(num(c.loy,50),0,100);c.train=num(c.train,40);if(!c.lv)c.lv={agri:1,comm:1,castle:1,order:1};}
function maxTroops(c){repairCastle(c);return Math.max(500,Math.round((c.pop*0.15+(c.lv.castle-1)*400+((c.town||1)-1)*300)/100)*100);}
function draftLimit(c){repairCastle(c);const base=c.pop*0.025*(0.6+c.loy/125)+(c.lv.castle-1)*50;return Math.max(0,Math.round(base*(1+roleBonus('mil')/100)/50)*50);}
function draftUsed(c){return (c.draft&&c.draft.m===now())?num(c.draft.used,0):0;}
function draftLeft(c){return Math.max(0,draftLimit(c)-draftUsed(c));}
function recruitCap(c){const P=FA(PLAYER);return Math.max(0,Math.min(draftLeft(c),maxTroops(c)-c.troops,Math.max(0,c.pop-1000),Math.floor(num(P.gold,0)/RECRUIT_GOLD),Math.floor(num(P.rice,0)/RECRUIT_RICE)));}
function recruitBlock(c,n){
  const P=FA(PLAYER);
  if(G.ap<=0)return '行動力がありません（次の月に回復します）';
  if(c.troops>=maxTroops(c))return '兵力上限に達しています（人口・城・城下町を発展させると上がります）';
  if(draftLeft(c)<=0)return '今月の徴兵上限に達しています（来月またこの城で募集できます）';
  if(c.pop-1000<50)return '人口が少なすぎます（民忠を上げると人口が回復します）';
  if(n!=null){if(num(P.gold,0)<n*RECRUIT_GOLD)return '資金が不足しています';if(num(P.rice,0)<n*RECRUIT_RICE)return '兵糧が不足しています';}
  else{if(num(P.gold,0)<50*RECRUIT_GOLD)return '資金が不足しています';if(num(P.rice,0)<50*RECRUIT_RICE)return '兵糧が不足しています';}
  return '';
}
function doRecruit(c,n){
  n=Math.min(n,recruitCap(c));if(n<=0||recruitBlock(c,n))return false;
  const P=FA(PLAYER);const mb=roleBonus('mil');
  P.gold-=Math.round(n*RECRUIT_GOLD);P.rice-=Math.round(n*RECRUIT_RICE);
  c.pop=Math.max(1000,c.pop-n);c.loy=Math.max(0,c.loy-n/200);
  c.train=Math.round((c.train*c.troops+(25+mb/4)*n)/(c.troops+n));c.troops+=n;
  c.draft={m:now(),used:draftUsed(c)+n};
  useAP();log(`${c.name}で${n}人を募兵`,'軍');autosave(true);return true;
}
function recruitModal(p){
  p=p||{};const P=FA(PLAYER);const cs=facCastles(PLAYER);if(!cs.length)return;
  cs.forEach(repairCastle);
  const cid=p.c&&own(p.c,PLAYER)?p.c:capitalOf(PLAYER);const c=CS(cid);
  const segs=`<div class="segs">${[['attack','出陣'],['recruit','兵士募集'],['train','訓練'],['move','兵の移動'],['guns','鉄砲']].map(([k,l])=>`<button data-t="${k}" class="${k==='recruit'?'on':''}">${l}</button>`).join('')}</div>`;
  const mx=maxTroops(c),lim=draftLimit(c),left=draftLeft(c),cap=recruitCap(c);const why=recruitBlock(c);
  const opts=[300,500,1000].map(n=>Math.min(n,cap)).filter((v,i,a)=>v>=50&&a.indexOf(v)===i);
  if(cap>=50&&!opts.includes(cap))opts.push(cap);
  const btn=n=>{const r=recruitBlock(c,n);return `<button class="act" data-rn="${n}" ${r?'disabled':''}><b>${fmt(n)}人を集める${n===cap&&cap!==300&&cap!==500&&cap!==1000?'（可能な最大）':''}</b><small>費用 金${fmt(n*RECRUIT_GOLD)}・兵糧${fmt(n*RECRUIT_RICE)}・行動1回${r?'<br>'+r:''}</small></button>`;};
  const body=`${apNote()}<label class="form"><span>城を選ぶ</span><select id="rcC">${cs.map(x=>opt(x.id,`${x.name}（兵${fmt(x.troops)}/${fmt(maxTroops(x))}・今月あと${fmt(draftLeft(x))}）`,cid)).join('')}</select></label>
   <div class="rstat">
    <div><span>兵力</span><b>${fmt(c.troops)} / ${fmt(mx)}</b><div class="bar"><i style="width:${Math.min(100,c.troops/mx*100)}%"></i></div></div>
    <div><span>今月の徴兵</span><b>あと ${fmt(left)} / ${fmt(lim)}</b><div class="bar"><i style="width:${lim?left/lim*100:0}%;background:var(--kin)"></i></div></div>
    <div><span>今回徴兵可能</span><b>${fmt(cap)}人</b></div>
    <div><span>費用（100人あたり）</span><b>金${fmt(100*RECRUIT_GOLD)}・兵糧${fmt(100*RECRUIT_RICE)}</b></div>
    <div><span>人口／民忠</span><b>${fmt(c.pop)}／${Math.round(c.loy)}</b></div>
    <div><span>手持ち</span><b>金${fmt(P.gold)}・米${fmt(P.rice)}</b></div>
   </div>
   ${why?`<div class="rwhy">募集できません：${why}</div>`:''}
   <div class="acts">${opts.length?opts.map(btn).join(''):''}</div>
   <div class="note">兵力上限は人口・城のレベル・城下町で決まる。今月の徴兵上限は人口と民忠で決まり、<b>毎月リセット</b>される。軍奉行を任命すると徴兵上限が増える${roleBonus('mil')?`（現在 ＋${roleBonus('mil')}%）`:''}。募兵すると人口が減り、民忠が少し下がる。</div>`;
  modal('軍事',segs+body,[]);
  document.querySelectorAll('#mBody .segs button').forEach(b=>b.onclick=()=>gunjiModal(b.dataset.t));
  $('#rcC').onchange=e=>recruitModal({c:e.target.value});
  document.querySelectorAll('[data-rn]').forEach(b=>b.onclick=()=>{const n=+b.dataset.rn;if(doRecruit(c,n)){toast(`${c.name}で${fmt(n)}人を集めた`);renderAll();}else toast(recruitBlock(c,n)||'募集できませんでした');recruitModal({c:cid});});
}
{const _gm=gunjiModal;gunjiModal=function(tab,p){if(tab==='recruit')return recruitModal(p);return _gm(tab,p);};}
/* 古いセーブの修復：旧仕様で人口が枯渇した城を回復し、数値の異常を直す */
{const _mig=migrate;migrate=function(g){_mig(g);
  Object.values(g.castles).forEach(c=>{repairCastle(c);if(c.draft&&(typeof c.draft!=='object'||!isFinite(c.draft.used)))delete c.draft;});
  if(!g.flags.recruitFix1){g.flags.recruitFix1=1;Object.values(g.castles).forEach(c=>{if(c.owner!==PLAYER)return;const base=Math.round(c.popMax/1.5*0.8);if(c.pop<base){c.pop=base;c.loy=Math.max(c.loy,40);}});}
  ['gold','rice'].forEach(k=>{const P=g.factions[PLAYER];if(P&&!isFinite(P[k]))P[k]=0;});
  return g;};}
safeInit();


</script>
