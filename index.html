<style>
*{box-sizing:border-box}
:root{
  --kon:#16203a;--kon2:#22305a;--kin:#c9a54a;--kin2:#e7cf8a;--shu:#c0392b;--shu2:#962b20;
  --bg:#e6e4dc;--panel:#f6f4ee;--card:#ffffff;--ink:#1b1d24;--ink2:#5b5e68;--line:#cfccc0;
  --sea:#9fb4c0;--sea2:#8ea5b2;--land:#e3e2cf;--land2:#d4d3bb;--river:#4f84a6;--mount:#7d6d4c;
  --good:#2e7a4f;--bad:#c0392b;--warn:#a26b08;--hl:#fff3c4;
  --shadow:0 2px 10px rgba(16,24,48,.14);
  --serif:"Hiragino Mincho ProN","Hiragino Mincho Pro","YuMincho","Yu Mincho","Noto Serif CJK JP","Noto Serif JP",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Noto Sans CJK JP","Noto Sans JP",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1220;--panel:#151b2d;--card:#1c2338;--ink:#ecebe4;--ink2:#a7abb9;--line:#2e3650;
  --sea:#1d2c3a;--sea2:#18252f;--land:#2b2f2a;--land2:#353a32;--river:#5b93b8;--mount:#a8936a;
  --good:#5cbf86;--bad:#ef6a58;--warn:#e3a640;--hl:#3a3420;--shadow:0 2px 14px rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1220;--panel:#151b2d;--card:#1c2338;--ink:#ecebe4;--ink2:#a7abb9;--line:#2e3650;
  --sea:#1d2c3a;--sea2:#18252f;--land:#2b2f2a;--land2:#353a32;--river:#5b93b8;--mount:#a8936a;
  --good:#5cbf86;--bad:#ef6a58;--warn:#e3a640;--hl:#3a3420;--shadow:0 2px 14px rgba(0,0,0,.55);color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);background:var(--kon)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;height:100vh;height:100dvh;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow:hidden}
body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;font-size:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:rgba(201,165,74,.25)}
img{-webkit-touch-callout:none}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--kin);outline-offset:2px}
#app{display:flex;flex-direction:column;height:100%;width:100%;overflow:hidden}
/* header */
#hdr{background:var(--kon);color:#f1ead6;display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:2px solid var(--kin);flex:none}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.seal{width:40px;height:40px;border-radius:8px;background:var(--shu);color:#fff;font-family:var(--serif);font-weight:800;display:grid;place-items:center;font-size:15px;line-height:1;writing-mode:vertical-rl;letter-spacing:1px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.ttl{font-family:var(--serif);font-weight:800;font-size:21px;letter-spacing:.12em;line-height:1.1}
.sub{font-size:11px;color:var(--kin2);letter-spacing:.2em}
.stats{display:flex;gap:6px;flex:1;min-width:0}
.st{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(201,165,74,.35);border-radius:8px;padding:3px 10px;min-width:0;max-width:150px}
.st b{display:block;font-family:var(--serif);font-size:17px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st span{display:block;font-size:11px;color:var(--kin2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.low b{color:#ff9a8a}
.st.ap b{color:var(--kin2)}
.st:first-child{flex:1.5}
#menuBtn{flex:none;background:none;border:1px solid var(--kin);color:#f1ead6;border-radius:10px;min-width:48px;height:46px;cursor:pointer;font-size:13px;line-height:1.1}
#menuBtn b{display:block;font-size:18px}
/* main */
#main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 360px}
#mapWrap{position:relative;min-height:0;background:var(--sea);overflow:hidden}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#map.drag{cursor:grabbing}
.mapctl{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;align-items:center;pointer-events:none}
.mapctl>*{pointer-events:auto}
.mapctl .seg{display:flex;border:1px solid var(--kin);border-radius:10px;overflow:hidden}
.mapctl button{background:var(--kon);color:#f1ead6;border:0;padding:0 14px;font-size:15px;cursor:pointer;min-height:44px;min-width:44px;font-weight:700}
.mapctl .zb{border:1px solid var(--kin);border-radius:10px;font-size:22px;padding:0}
.mapctl .seg button.on{background:var(--kin);color:var(--kon)}
.mapctl .sp{flex:1}
.mapctl #mapList{border:1px solid var(--kin);border-radius:10px;font-size:13px}
.legend{position:absolute;left:10px;bottom:10px;background:var(--panel);background:color-mix(in srgb,var(--panel) 90%,transparent);opacity:.97;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;max-width:260px;line-height:1.5;pointer-events:none}
.legend .wx{font-family:var(--serif);font-weight:700;font-size:13px}
/* svg */
.sea{fill:var(--sea)}
.wave{fill:none;stroke:var(--sea2);stroke-width:1.2}
.land{fill:var(--land);stroke:#6f7a72;stroke-width:1.6;stroke-linejoin:round}
.jland{fill:var(--land);stroke:#6f7a72;stroke-width:1;stroke-linejoin:round}
.border{fill:none;stroke:var(--mount);stroke-width:1.4;stroke-dasharray:7 5;opacity:.7}
.spine{fill:none;stroke:var(--mount);stroke-width:9;opacity:.16;stroke-linecap:round;stroke-linejoin:round}
.peak{fill:var(--mount);opacity:.8}
.peakT{font-size:10px;fill:var(--mount);text-anchor:middle;font-family:var(--serif)}
.river{fill:none;stroke:var(--river);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.riverT{font-size:10.5px;fill:var(--river);font-family:var(--serif);font-weight:700}
.lake{fill:var(--sea);stroke:var(--river);stroke-width:1}
.prov{font-family:var(--serif);font-size:30px;font-weight:800;fill:var(--ink);opacity:.13;letter-spacing:.3em;text-anchor:middle}
.regT{font-family:var(--serif);font-size:15px;font-weight:800;fill:var(--ink);opacity:.38;letter-spacing:.15em;text-anchor:middle;pointer-events:none}
.seaT{font-family:var(--serif);font-size:22px;fill:#fff;opacity:.55;letter-spacing:.4em;text-anchor:middle}
.offT{font-family:var(--serif);font-size:13px;fill:var(--ink);opacity:.6}
.edge{stroke:var(--ink2);stroke-width:1.3;opacity:.35;stroke-dasharray:3 4}
.edge.m{stroke-dasharray:1 4;stroke-width:2;stroke-linecap:round}
.edge.war{stroke:var(--shu);opacity:.8;stroke-width:2}
.jwar{stroke:var(--shu);stroke-width:2;stroke-dasharray:5 4;opacity:.85;fill:none}
.route{fill:none;stroke:var(--kin);stroke-width:4;opacity:.75;stroke-dasharray:10 6;stroke-linecap:round}
.routeT{font-family:var(--serif);font-size:12px;font-weight:700;fill:var(--kin)}
.arrhead{fill:var(--kin)}
.cs,.jf{cursor:pointer}
.cs .hit{fill:transparent}
.cs .dot{stroke:#fff;stroke-width:2}
.cs .capring{fill:none;stroke-width:2.2}
.cs .pdot{fill:#fff}
.cs.sel .dot{stroke:var(--kin);stroke-width:3.5}
.jf .blob{opacity:.62;stroke:#fff;stroke-width:1}
.jf.me .blob{opacity:.85;stroke:var(--kin);stroke-width:1.5}
.jn{font-family:var(--serif);font-weight:800;font-size:11px;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round;text-anchor:middle;pointer-events:none}
.cn{font-family:var(--serif);font-weight:800;font-size:13px;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:3.5px;stroke-linejoin:round}
.ct{font-size:10px;fill:var(--ink2);paint-order:stroke;stroke:var(--land);stroke-width:3px}
.cs.mine .cn{fill:#1e3c86}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cs.mine .cn{fill:#9fbaf5}}
:root[data-theme="dark"] .cs.mine .cn{fill:#9fbaf5}
/* side / status */
#side{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#statusPanel{padding:12px;border-bottom:1px solid var(--line)}
.sp-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sp-head h3{margin:0;font-family:var(--serif);font-size:17px;flex:1;padding-left:9px;border-left:4px solid var(--shu)}
.pips{font-size:13px;font-weight:700;white-space:nowrap}
.pips i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--shu);margin-right:3px;vertical-align:-1px}
.pips i.off{background:var(--line)}
.sp-list{display:grid;gap:6px}
.warn{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--warn);border-radius:9px;padding:8px 10px;font-size:14.5px;line-height:1.5}
.warn.bad{border-left-color:var(--bad)}
.warn.ok{border-left-color:var(--good)}
.warn.info{border-left-color:#2e6fb8}
.sp-more{background:none;border:0;color:var(--ink2);font-size:13.5px;cursor:pointer;padding:6px 0;min-height:36px;text-decoration:underline}
.sp-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.sp-btns .btn{min-height:48px;font-size:16px;font-family:var(--serif)}
#sideLog{padding:12px}
.sec{margin-bottom:14px}
.sec h3{font-family:var(--serif);font-size:15px;margin:0 0 6px;padding-left:9px;border-left:4px solid var(--shu)}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;text-align:left;width:100%;min-height:56px}
.row:hover{border-color:var(--kin)}
.row .nm{font-weight:800;font-family:var(--serif);font-size:16.5px}
.row .meta{font-size:13px;color:var(--ink2)}
.row .grow{flex:1;min-width:0}
.dotc{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.badge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--line);color:var(--ink);margin:1px 2px;white-space:nowrap;font-weight:700;vertical-align:1px}
.badge.war{background:var(--shu);color:#fff}.badge.ally{background:#2e6fb8;color:#fff}.badge.good{background:var(--good);color:#fff}
.badge.bad{background:#b0651d;color:#fff}.badge.bad2{background:#7d1f15;color:#fff}.badge.neu{background:#8a8d96;color:#fff}
.badge.hist{background:#6b5a2e;color:#fff}.badge.alt{background:var(--shu);color:#fff}.badge.cond{background:#2e6fb8;color:#fff}.badge.rnd{background:#5a6b4a;color:#fff}
.badge.role{background:var(--kin);color:#1b1d24}
.stat4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}
.stat4 div{background:var(--panel);border-radius:7px;padding:2px 6px;text-align:center}
.stat4 span{display:block;font-size:11px;color:var(--ink2)}
.stat4 b{font-size:16px;font-family:var(--serif)}
.loyv{font-weight:800}
.loyv.lo{color:var(--bad)}
.logi{font-size:13.5px;padding:6px 0;border-bottom:1px dashed var(--line)}
.logi .d{color:var(--ink2);font-size:12px;margin-right:6px}
/* command bar */
#cmd{flex:none;display:grid;grid-template-columns:repeat(6,1fr) 1.7fr;gap:6px;padding:8px 10px;background:var(--kon);border-top:2px solid var(--kin)}
#cmd button{background:linear-gradient(#2a3a66,#1b2647);border:1px solid rgba(201,165,74,.55);border-radius:12px;color:#f1ead6;cursor:pointer;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60px}
#cmd button b{font-family:var(--serif);font-size:21px;line-height:1.1;color:var(--kin2)}
#cmd button span{font-size:13px;font-weight:700}
#cmd button.next{background:linear-gradient(#d24a3a,var(--shu2));border-color:#f0b6a8}
#cmd button.next b{color:#fff;font-size:19px}
#cmd button.next span{font-size:12px;opacity:.9}
#cmd button.next.ready{box-shadow:0 0 0 3px var(--kin2)}
/* modal */
.modal{position:fixed;top:0;left:0;right:0;bottom:0;inset:0;background:rgba(8,12,24,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.modal.hidden{display:none}
.sheet{background:var(--panel);color:var(--ink);border-radius:16px;max-width:620px;width:100%;max-height:88vh;max-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 24px);display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.4);border:1px solid var(--kin);overflow:hidden}
.sheet.wide{max-width:900px}
.mh{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--kon);color:#f1ead6;border-bottom:2px solid var(--kin);flex:none}
.mh h2{margin:0;font-family:var(--serif);font-size:19px;flex:1;letter-spacing:.05em}
.mh button{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;width:36px;height:36px;cursor:pointer;font-size:16px}
.mb{padding:14px 16px;overflow-y:auto;flex:1;min-height:0;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;-webkit-user-select:text;user-select:text}
.mf{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px;border-top:1px solid var(--line);flex:none;justify-content:flex-end}
.mf:empty{display:none}
.btn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:700;min-height:44px}
.btn:hover:not(:disabled){border-color:var(--kin)}
.btn.pri{background:var(--shu);border-color:var(--shu2);color:#fff}
.btn.kon{background:var(--kon2);border-color:var(--kon);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;min-height:34px;font-size:13px}
.choice{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--kin);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.choice:hover:not(:disabled){border-color:var(--kin);background:var(--hl)}
.choice:disabled{opacity:.45;cursor:not-allowed}
.choice b{font-family:var(--serif);font-size:16px;display:block}
.choice small{color:var(--ink2);font-size:12.5px}
.evdate{font-size:12.5px;color:var(--ink2);margin-bottom:6px}
.evtext{font-family:var(--serif);font-size:15.5px;line-height:1.85;margin-bottom:12px}
.note{font-size:12px;color:var(--ink2);background:var(--card);border:1px dashed var(--line);border-radius:8px;padding:6px 9px;margin:8px 0}
.form{display:grid;gap:10px}
.form label{display:grid;gap:3px;font-size:13px;color:var(--ink2);font-weight:700}
select,input[type=number]{font-family:inherit;font-size:16px;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:42px;width:100%}
input[type=range]{width:100%;accent-color:var(--shu)}
.radios{display:flex;flex-wrap:wrap;gap:6px}
.radios label{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 10px;color:var(--ink);font-weight:500;cursor:pointer}
.chk{display:flex!important;align-items:center;gap:8px;grid-template-columns:none!important;color:var(--ink)!important;font-weight:500!important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin:8px 0}
.kv div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 9px}
.kv span{display:block;font-size:11px;color:var(--ink2)}
.kv b{font-size:15px}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-top:8px}
.act{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;text-align:left;cursor:pointer;min-height:64px}
.act:hover:not(:disabled){border-color:var(--kin);background:var(--hl)}
.act:disabled{opacity:.45;cursor:not-allowed}
.act b{display:block;font-family:var(--serif);font-size:15px}
.act small{font-size:12px;color:var(--ink2);display:block;line-height:1.4}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;background:var(--kon2)}
.relbar{position:relative;height:8px;border-radius:4px;background:linear-gradient(90deg,#7d1f15,#b0651d 30%,#8a8d96 50%,#2e7a4f 80%,#2e6fb8);margin-top:4px}
.relbar i{position:absolute;top:-3px;width:4px;height:14px;background:var(--ink);border-radius:2px;transform:translateX(-2px)}
.tbl-wrap{overflow-x:auto}
table.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th,.tbl td{padding:6px 7px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:12px;color:var(--ink2);white-space:nowrap}
.tbl tr.alt td{background:rgba(192,57,43,.09)}
.segs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.segs button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 13px;cursor:pointer;font-weight:700;font-size:13px;min-height:36px}
.segs button.on{background:var(--kon2);color:#fff;border-color:var(--kon)}
/* battle */
.bt{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start}
.bside{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 11px;border-top:5px solid}
.bside h4{margin:0 0 3px;font-family:var(--serif);font-size:15px}
.bside .gens{font-size:12px;color:var(--ink2);min-height:18px}
.vs{font-family:var(--serif);font-weight:800;font-size:22px;color:var(--shu);align-self:center}
.bnum{font-family:var(--serif);font-size:22px;font-weight:800}
.blog{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:10px;max-height:220px;overflow-y:auto;font-size:13px}
.blog div{padding:2px 0;border-bottom:1px dotted var(--line)}
.blog div:first-child{font-weight:700}
.bres{font-family:var(--serif);font-size:26px;font-weight:800;text-align:center;margin:6px 0}
.bres.win{color:var(--good)}.bres.lose{color:var(--bad)}
/* toast */
#toast{position:fixed;left:50%;top:70px;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);background:var(--kon);color:#fff;border:1px solid var(--kin);padding:9px 16px;border-radius:99px;font-size:14px;z-index:80;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
/* title */
.titlescr{position:fixed;top:0;left:0;right:0;bottom:0;inset:0;padding-top:max(20px,env(safe-area-inset-top));padding-bottom:max(20px,env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;z-index:100;background:radial-gradient(ellipse at 50% 35%,#2a3a6b 0%,#121a31 60%,#0b1022 100%);color:#f1ead6;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.titlescr.hidden{display:none}
.tbox{max-width:560px;width:100%;text-align:center}
.tmoon{width:120px;height:120px;margin:0 auto 6px;display:block}
.tname{font-family:var(--serif);font-weight:800;font-size:clamp(40px,11vw,64px);letter-spacing:.18em;margin:0;line-height:1.15;text-shadow:0 2px 0 #000}
.tsub{font-family:var(--serif);font-size:clamp(15px,4.4vw,20px);color:var(--kin2);letter-spacing:.3em;margin:4px 0 22px}
.tbtns{display:grid;gap:10px;max-width:320px;margin:0 auto}
.tbtns .btn{font-size:16px;min-height:52px;font-family:var(--serif)}
.tdisc{font-size:12px;color:#b9bccb;margin-top:22px;line-height:1.7;text-align:left;background:rgba(255,255,255,.05);border:1px solid rgba(201,165,74,.3);border-radius:10px;padding:10px 12px}
@media (max-width:860px){
  #hdr{padding:6px;gap:5px}
  .brand .ttl,.brand .sub{display:none}.brand{display:none}
  .stats{gap:4px}
  .st{padding:2px 5px;max-width:none}.st b{font-size:14.5px}.st span{font-size:10.5px}
  #menuBtn{min-width:46px;height:44px;font-size:11px}
  #main{display:flex;flex-direction:column}
  #side{order:-1;border-left:0;border-bottom:1px solid var(--line);flex:none;max-height:42vh;overflow-y:auto}
  #statusPanel{padding:8px 10px;border-bottom:0}
  #sideLog{display:none}
  .sp-head{margin-bottom:6px}.sp-head h3{font-size:15.5px}
  .warn{font-size:14px;padding:6px 9px}
  .sp-btns{margin-top:7px}.sp-btns .btn{min-height:44px;font-size:15px}
  #mapWrap{flex:1;min-height:200px}
  #cmd{gap:4px;padding:6px 6px;grid-template-columns:repeat(6,1fr)}
  #cmd button.next{grid-column:1/-1;order:-1;min-height:48px;flex-direction:row;gap:10px}
  #cmd button{min-height:58px;border-radius:10px}
  #cmd button b{font-size:19px}
  #cmd button span{font-size:12px}
  #cmd button.next b{font-size:17px}
  .legend{font-size:11px;max-width:200px;padding:4px 8px}
  .legend .lg{display:none}
  .mapctl button{padding:0 12px}
  .modal{padding:0;align-items:flex-end}
  .sheet{border-radius:16px 16px 0 0;max-height:90vh}
  .bt{grid-template-columns:1fr;}.vs{text-align:center}
  .grid2{grid-template-columns:1fr}
  .acts{grid-template-columns:1fr}
  .kv{grid-template-columns:repeat(3,1fr)}.kv b{font-size:14px}
  .hyo{grid-template-columns:1fr 1fr;gap:8px}.hcard{padding:9px}.hcard h4{font-size:16px}.hcard .hl{font-size:13px;line-height:1.6}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
/* v2 components */
.bars2{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.ncards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:10px}
.ncard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.ncard .nh{display:flex;align-items:center;gap:10px}
.ncard .ic{width:42px;height:42px;border-radius:10px;background:var(--kon);color:var(--kin2);font-family:var(--serif);font-size:22px;font-weight:800;display:grid;place-items:center;flex:none}
.ncard .nt{font-family:var(--serif);font-size:19px;font-weight:800;flex:1}
.lvp{display:flex;gap:3px}
.lvp i{width:16px;height:8px;border-radius:3px;background:var(--line)}
.lvp i.on{background:var(--kin)}
.ncard .line{font-size:14px}
.ncard .line b{font-size:15px}
.ncard .rl{font-size:12.5px;color:var(--ink2)}
.ncard .btn{min-height:48px;font-size:16px;margin-top:auto}
.confirm{font-family:var(--serif);font-size:18px;text-align:center;margin:6px 0 12px}
.cbox{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15.5px}
.cbox span{color:var(--ink2)}

.hcard .cn2{font-size:13px;color:var(--bad);font-weight:700;margin-top:4px}
.recs{display:grid;gap:10px}
.rec{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--kin);border-radius:12px;padding:12px}
.rec p{margin:0 0 8px;font-size:15.5px;line-height:1.6}
.rec .btn{min-height:44px}
.menu{display:grid;gap:8px}
.menu .btn{text-align:left;min-height:52px;font-size:16px}
.rolelist{display:grid;gap:8px}
.can{display:grid;gap:8px;margin-top:6px}
.can .btn{text-align:left;min-height:50px;font-size:15.5px}
#saveInd{position:fixed;top:calc(env(safe-area-inset-top,0px) + 3px);right:64px;z-index:90;background:var(--kon);color:var(--kin2);border:1px solid var(--kin);font-size:12.5px;padding:4px 11px;border-radius:99px;opacity:0;transition:opacity .3s;pointer-events:none}

#tut.hidden{display:none}
#tut h4{margin:0 0 4px;font-family:var(--serif);font-size:19px;color:var(--kin2)}
#tut p{margin:0 0 10px;font-size:15px;line-height:1.6}

#tut .tb .btn{min-height:44px}

.tut-hl{outline:4px solid var(--kin2)!important;outline-offset:2px;animation:tutp 1.2s ease-in-out infinite}

.face{position:relative;display:inline-grid;place-items:center;width:52px;height:52px;border-radius:12px;overflow:hidden;background:linear-gradient(155deg,var(--fc,#556) 0%,#141826 95%);flex:none;border:2px solid var(--kin);vertical-align:middle;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.face .fph{color:#fff;font-family:var(--serif);font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;font-size:15px;text-shadow:0 1px 2px rgba(0,0,0,.6);letter-spacing:.02em;text-align:center;padding:2px}
.face .fph small{font-size:9px;font-weight:500;opacity:.85}
.face .fph.l3{font-size:.8em}
.face .fimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.face.xs{width:30px;height:30px;border-radius:8px;border-width:1px}.face.xs .fph{font-size:10px}.face.xs .fph small{display:none}
.face.sm{width:40px;height:40px;border-radius:10px}.face.sm .fph{font-size:12px}.face.sm .fph small{font-size:8px}
.face.md{width:56px;height:56px}
.face.lg{width:92px;height:92px;border-radius:16px}.face.lg .fph{font-size:22px}.face.lg .fph small{font-size:12px}
.face.empty{background:var(--line);border-style:dashed}
.frow{display:flex;gap:12px;flex-wrap:wrap;margin:4px 0 10px}
.fitem{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;font-weight:700;max-width:80px;text-align:center;line-height:1.3}
.fitem small{font-weight:400;color:var(--ink2)}
.gface{display:inline-flex;align-items:center;gap:5px;margin:2px 8px 2px 0;font-size:13px;color:var(--ink)}
.ocards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.ocard{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left;cursor:pointer;position:relative;color:var(--ink)}
.ocard:hover{border-color:var(--kin)}
.oc-b b{font-family:var(--serif);font-size:17px;display:block;line-height:1.25}
.oc-b small{color:var(--ink2);font-size:12.5px}
.oc-tags{margin-top:2px}.oc-tags .badge{margin:1px 3px 1px 0}
.oc-s{font-size:12.5px;color:var(--ink2)}
.oc-st{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.oc-st div{background:var(--panel);border-radius:8px;padding:2px 4px;text-align:center}
.oc-st span{display:block;font-size:11px;color:var(--ink2)}.oc-st b{font-family:var(--serif);font-size:17px}
.oc-kin{display:block;text-align:center;color:var(--ink2);font-size:13px}
.oc-loy{grid-column:1/-1;font-size:13px}
.oc-more{position:absolute;top:10px;right:12px;font-size:12.5px;color:var(--ink2);font-weight:700}
.rolechips{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.rchip{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.rchip b{display:block;font-size:13.5px}.rchip small{font-size:12px;color:var(--ink2)}
.ohead{display:flex;gap:14px;align-items:center;margin-bottom:8px}
.relrow{display:flex;align-items:center;gap:8px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:6px;cursor:pointer;text-align:left;color:var(--ink)}
.rel-mid{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:56px}
.rel-mid i{font-style:normal;color:var(--ink2);font-size:13px}.rel-mid small{display:none}
.rel-nm b{display:block;font-family:var(--serif);font-size:15px}.rel-nm small{font-size:12px;color:var(--ink2)}
.relline{display:grid;grid-template-columns:auto 1fr auto 1fr auto;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:6px;font-size:14px}
.relline b{display:block;font-family:var(--serif);font-size:14.5px;line-height:1.2}.relline small{font-size:11.5px;color:var(--ink2)}
.relline span:nth-child(4){text-align:right}
.opin{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--kin);border-radius:12px;padding:10px;margin-bottom:8px}
.opb{flex:1;min-width:0}.opn{font-family:var(--serif);font-weight:800;font-size:15.5px}
.opq{font-family:var(--serif);font-size:16px;line-height:1.7;margin:4px 0 8px}
.opb .btn{min-height:44px;text-align:left}
.ctags{display:grid;gap:4px;font-size:14px;margin-bottom:6px}
.rates{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:4px 10px;font-size:13.5px}
.rates span{color:var(--ink2);margin-right:6px}.rates b{color:var(--kin);letter-spacing:1px}.st0{color:var(--line)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tcard{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--kin);border-radius:12px;padding:10px;font-size:14px}
.tcard.locked{opacity:.6;border-top-color:var(--line)}.tcard b{font-family:var(--serif);font-size:16px}
.tcard .tk{font-size:12px;color:var(--ink2)}.tcard .meta{font-size:13px;color:var(--ink2);margin:4px 0}
.tgain{margin-top:10px;background:var(--hl);border:1px solid var(--kin);border-radius:10px;padding:8px 10px;font-size:15px}
.sdmap{width:100%;max-width:520px;display:block;margin:0 auto 8px;border-radius:12px;border:1px solid var(--line)}
.sd-bg{fill:var(--land)}.sd-river{fill:none;stroke:var(--river);stroke-width:9;opacity:.75;stroke-linecap:round}
.sd-t{font-family:var(--serif);font-size:13px;font-weight:700;fill:var(--ink)}
.sd-site{fill:var(--kin);opacity:.18}
.sd-f rect{fill:var(--card);stroke:var(--line);stroke-width:2}.sd-f.on rect{fill:var(--kon2);stroke:var(--kin)}
.sd-i{font-family:var(--serif);font-size:18px;font-weight:800;fill:var(--ink2)}.sd-f.on .sd-i{fill:var(--kin2)}
.sd-l{font-size:11px;fill:var(--ink);font-weight:700}
@media (max-width:860px){
  .ocards{grid-template-columns:1fr 1fr;gap:8px}
  .ocard{grid-template-columns:1fr;padding:9px;justify-items:start}
  .ocard .face{width:46px;height:46px}
  .oc-st{grid-template-columns:1fr 1fr}
  .oc-b b{font-size:15.5px}
  .oc-more{top:9px;right:9px}
  .relline{gap:6px;padding:7px}.relline b{font-size:13.5px}
  .tgrid{grid-template-columns:1fr}
}
@media (max-width:340px){.ocards{grid-template-columns:1fr}}
/* 兵士募集 */
.rstat{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.rstat>div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.rstat span{display:block;font-size:12px;color:var(--ink2)}.rstat b{font-size:16px;font-family:var(--serif)}
.rwhy{background:#fbe3dd;color:#7a1f14;border:1px solid #e8a99c;border-radius:10px;padding:8px 10px;font-weight:700;margin:6px 0}
/* v4: Safari・肖像 */
.face{width:48px;height:64px;border-radius:9px;background:#d8cfb8;display:inline-block;position:relative;overflow:hidden;flex:none;border:2px solid var(--kin);vertical-align:middle}
.face .pimg{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block}
.face.xs{width:30px;height:40px;border-radius:6px;border-width:1px}
.face.sm{width:40px;height:53px;border-radius:8px}
.face.md{width:57px;height:76px}
.face.lg{width:120px;height:160px;border-radius:14px}
.face.card{width:100%;height:auto;padding-top:133.33%;border-radius:12px;border-width:2px}
.face.sil{background:#cfc6b0 radial-gradient(circle at 50% 42%,#8f8a7e 0 19%,transparent 20%) no-repeat;}
.face.sil::after{content:"";position:absolute;left:18%;right:18%;bottom:0;height:34%;background:#8f8a7e;border-radius:50% 50% 0 0}
.fitem{max-width:84px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.pcard{display:flex;flex-direction:column;align-items:stretch;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 8px 10px;text-align:left;cursor:pointer;color:var(--ink);min-width:0}
.pcard .pc-img{display:block;width:88%;margin:0 auto 2px}
.pcard .pc-name{font-family:var(--serif);font-weight:800;font-size:17px;line-height:1.25;text-align:center}
.pcard .pc-age{font-size:13px;color:var(--ink2);text-align:center}
.pcard .pc-age small{font-size:11px}
.pcard .pc-role{text-align:center;min-height:22px}
.pcard .pc-loy{font-size:13px}
.pcard .pc-st{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.pcard .pc-st span{display:flex;justify-content:space-between;align-items:baseline;background:var(--panel);border-radius:6px;padding:2px 7px;font-size:12px;color:var(--ink2)}
.pcard .pc-st b{font-family:var(--serif);font-size:16px;color:var(--ink)}
.pcard.dead{opacity:.72}.pcard.dead .pimg{filter:grayscale(.8)}
.pgrid.mini{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.pgrid.mini .pc-st{display:none}
details.sec summary{font-family:var(--serif);font-size:15px;font-weight:700;cursor:pointer;padding:10px 0;min-height:44px}
.nrec{background:var(--hl);border:1px solid var(--kin);border-radius:12px;padding:8px 10px;margin:6px 0 10px}
.nrec>b{font-family:var(--serif)}
.nrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0;font-size:14.5px}
.nrow small{color:var(--ink2);font-size:12px}
.nrow .btn{min-height:40px;min-width:76px}
.crumb{font-size:13px;color:var(--ink2);margin-bottom:8px}.crumb b{color:var(--ink)}
.jtohoku rect{fill:var(--kon);stroke:var(--kin);stroke-width:1.5}.jtohoku text{fill:#f1ead6;font-size:12px;font-weight:700}
.svst{font-size:11.5px;color:var(--good);white-space:nowrap;font-weight:700}.svst.saving{color:var(--warn)}.svst.error,.svst.off{color:var(--bad)}
#saveInd{display:none}#saveInd.show{display:block}
.tmsg{font-family:var(--serif);font-size:18px;margin:6px 0 12px}.tmsg.small{font-size:13px;color:#ffd6a8}
#errBar{position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:200;display:none;align-items:center;gap:8px;justify-content:space-between;background:#5a1d16;color:#fff;border:1px solid #f0b6a8;border-radius:12px;padding:8px 10px;font-size:14px}
.menu .btn small{font-weight:400;color:var(--ink2)}
@media (max-width:860px){
  .pgrid{grid-template-columns:1fr 1fr;gap:8px}
  .pgrid.mini{grid-template-columns:1fr 1fr}
  .face.lg{width:108px;height:144px}
}
@media (orientation:landscape) and (max-height:560px){
  #hdr{padding:3px 8px}.st{padding:1px 6px}.st b{font-size:13.5px}.st span{font-size:10px}#menuBtn{height:38px}
  #main{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(230px,36%)}
  #side{order:0!important;max-height:none!important;border-left:1px solid var(--line);border-bottom:0}
  #mapWrap{min-height:0}
  #cmd{grid-template-columns:repeat(6,1fr) 1.6fr!important;padding:4px 6px}
  #cmd button{min-height:44px!important}
  #cmd button.next{grid-column:auto!important;order:0!important;flex-direction:column}
  #cmd button b{font-size:16px}
  .sheet{max-height:94vh;max-height:calc(100dvh - 12px)}
  .pgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
}
</style>

function centralPower(f){const y=G.year;if(f==='toyotomi')return y<1585?60000:y<1587?100000:y<1590?160000:220000;if(f==='tokugawa')return 40000;if(f==='hojo')return G.flags.hojoFallen?0:50000;if(f==='uesugi')return 25000;return 0;}
function facPower(f){const F=FA(f);if(!F)return 0;if(F.central)return centralPower(f);return facTroops(f);}

function leaderName(f){const F=FA(f);const L=F&&F.leader&&OF(F.leader);return L&&L.alive?L.name:'（当主不在）';}
function capitalOf(f){const F=FA(f);if(!F)return null;const L=F.leader&&OF(F.leader);if(L&&L.alive&&L.castle&&own(L.castle,f))return L.castle;const cs=facCastles(f).sort((a,b)=>b.troops-a.troops);return cs.length?cs[0].id:null;}
function nearestOwn(f,cid){
  const seen={[cid]:1};let q=[cid];
  while(q.length){const nq=[];for(const c of q){for(const n of neighbors(c)){if(seen[n])continue;seen[n]=1;if(own(n,f))return n;nq.push(n);}}q=nq;}
  const any=facCastles(f).filter(c=>c.id!==cid);return any.length?any[0].id:null;
}

  if(F.marriage){F.marriage=false;log(`${F.name}との婚姻関係も破綻した`,'外');}
  log(`${F.name}との同盟を破棄した。家中・諸国の信用が揺らぐ`,'外');}

function rollWeather(){const m=G.month;let w;
  if(m===12||m<=2)w=Math.random()<0.65?'雪':'曇';
  else if(m===6||m===7)w=Math.random()<0.5?'雨':(Math.random()<0.5?'曇':'晴');
  else{const r=Math.random();w=r<0.55?'晴':r<0.8?'曇':r<0.93?'雨':'霧';}
  G.weather=w;}
function castleGold(c){return c.comm*0.9*(0.7+c.loy/200)*(1+c.road/250);}
function castleHarvest(c){return c.agri*12*(0.6+c.loy/250)*(1+c.flood/500);}
function monthlyGold(){let g=0;facCastles(PLAYER).forEach(c=>g+=castleGold(c));Object.values(G.factions).forEach(f=>{if(f.trade&&f.alive&&!f.war)g+=40;});return Math.round(g);}
function monthlyRice(){return Math.round(facTroops(PLAYER)*RICE_PER_TROOP);}

/* ================= 所有・武将の移動 ================= */
function changeOwner(cid,nf,how){
  const c=CS(cid);const of=c.owner;if(of===nf)return;
  c.owner=nf;c.acq={y:G.year,m:G.month,how};c.gov=null;c.loy=Math.max(10,c.loy-(how==='war'?15:5));
  const offs=Object.values(G.officers).filter(o=>o.alive&&o.fac===of&&o.castle===cid);
  offs.forEach(o=>{
    const dest=nearestOwn(of,cid);
    if(o.kin||o.id==='masamune'||(of===PLAYER&&o.id===FA(PLAYER).leader)){if(dest){o.castle=dest;return;}if(o.kin){o.alive=false;return;}killOfficer(o.id,'落城に際し自害');return;}
    if(dest&&Math.random()<0.55){o.castle=dest;return;}
    if(nf===PLAYER){o.fac='captive';o.prevFac=of;o.castle=cid;G.queue.unshift({k:'captive',id:o.id});}
    else{if(of===PLAYER)log(`${o.name}は${c.name}落城で消息を絶った`,'人');o.fac=Math.random()<0.4?nf:'ronin';o.castle=o.fac===nf?cid:null;o.loy=50;}
  });
  if(of&&FA(of)&&FA(of).alive&&facCastles(of).length===0)destroyFaction(of,nf);
}
function destroyFaction(f,by){
  const F=FA(f);if(!F||!F.alive)return;F.alive=false;F.war=false;F.ally=false;F.trade=false;
  G.aiWars=G.aiWars.filter(p=>p[0]!==f&&p[1]!==f);
  facOfficers(f).forEach(o=>{
    if(f==='ashina'&&alive('satake')&&o.id!=='kojiro'){o.fac='satake';o.castle=capitalOf('satake');}
    else{o.fac='ronin';o.castle=null;}
  });
  const t=`${F.name}滅亡`+(by&&FA(by)?`（${FA(by).name}による）`:'');
  log(t,'戦');hist(t,by===PLAYER);
}
function absorbFaction(f){
  const F=FA(f);if(!F||!F.alive)return;
  facOfficers(f).forEach(o=>{o.fac=PLAYER;o.loy=clamp(55+F.rel/5,40,85);});
  facCastles(f).forEach(c=>{c.owner=PLAYER;c.acq={y:G.year,m:G.month,how:'diplo'};});
  F.alive=false;F.war=false;F.ally=false;
  G.aiWars=G.aiWars.filter(p=>p[0]!==f&&p[1]!==f);
  const t=`${F.name}、伊達家に臣従する`;log(t,'外');hist(t,true);
}
function killOfficer(id,how){
  const o=OF(id);if(!o||!o.alive)return;o.alive=false;const f=o.fac;o.castle=null;
  log(`${o.name}、${how}`,'人');
  Object.values(G.castles).forEach(c=>{if(c.gov===id)c.gov=null;});
  if(G.roles)for(const k in G.roles)if(G.roles[k]===id)delete G.roles[k];
  const F=FA(f);if(F&&F.leader===id)succession(f);
}
function succession(f){
  const F=FA(f);
  if(f===PLAYER){const k=OF('kojiro');if(k&&k.alive&&k.fac===PLAYER){F.leader='kojiro';k.loy=100;hist('伊達小次郎が伊達家の家督を継ぐ',true);G.flags.kojiroLeader=1;}else F.leader=null;return;}
  const cand=facOfficers(f,true).sort((a,b)=>(b.lea+b.pol)-(a.lea+a.pol))[0];
  F.leader=cand?cand.id:null;if(cand)log(`${F.name}の家督を${cand.name}が継いだ`,'人');
}
function fleeTroops(fac,cid,n){const d=nearestOwn(fac,cid);if(d)CS(d).troops+=Math.round(n);}
function returnTroops(side,n){
  n=Math.max(0,Math.round(n));if(!n)return;
  const tot=side.origins.reduce((t,o)=>t+o.n,0);if(!tot)return;
  let rem=n;
  side.origins.forEach((o,i)=>{const share=i===side.origins.length-1?rem:Math.round(n*o.n/tot);rem-=share;
    if(own(o.c,o.fac))CS(o.c).troops+=share;else{const alt=alive(o.fac)?nearestOwn(o.fac,o.c):null;if(alt)CS(alt).troops+=share;}});
}

/* ================= 合戦エンジン ================= */
function mkSide(fac,troops,gens,origins,ex){
  ex=ex||{};const isP=fac===PLAYER;
  const tot=origins.reduce((t,o)=>t+o.n,0);
  const train=ex.train!=null?ex.train:(tot?Math.round(origins.reduce((t,o)=>t+((CS(o.c)&&CS(o.c).train)||45)*o.n,0)/tot):50);
  const morale=ex.morale!=null?ex.morale:clamp(55+train/5+(isP?G.prestige/8:9)+rnd(-5,5),30,95);
  troops=Math.max(0,Math.round(troops));
  return {fac,label:ex.label||FA(fac).name,troops,start:troops,morale,train,gens:(gens||[]).filter(Boolean),origins,
    guns:isP?Math.min(G.guns,troops):Math.round(troops*0.05),rice:ex.rice!=null?ex.rice:troops*0.6,bonus:1};
}
function pickAIGens(f,cid){
  const offs=facOfficers(f,true);if(!offs.length)return [];
  const here=offs.filter(o=>o.castle===cid);const pool=here.length?here:offs;
  return pool.sort((a,b)=>b.lea-a.lea).slice(0,2).map(o=>o.id);
}
function newBattle(o){
  const b=Object.assign({round:0,pr:0,log:[],result:null,weather:G.weather,tactic:'normal',special:{},playerSide:null,terrain:'p',castle:null,hook:null,summary:null},o);
  if(b.castle){b.castleDef=CS(b.castle).def;b.cmult=(typeof castleDefMult==='function')?castleDefMult(b.castle):1;b.def.morale=Math.min(100,b.def.morale+8);}
  if(!b.phase){
    if(b.castle&&b.autoPhase){const a=sideMult(b.atk,b,true).m*b.atk.troops,d=sideMult(b.def,b,false).m*b.def.troops;b.phase=(d>=a*0.8&&b.def.troops>300)?'field':'siege';}
    else b.phase=b.castle?'siege':'field';
  }
  b.maxField=5;b.maxSiege=b.tactic==='starve'?12:8;
  b.log.push(`天候：${b.weather}　地形：${{m:'山岳',p:'平地',r:'河川'}[b.terrain]}`);
  if(b.castle&&b.phase==='field')b.log.push(`${b.def.label}は城から打って出た`);
  if(b.castle&&b.phase==='siege')b.log.push(`${b.def.label}は${CS(b.castle).name}に籠城した`);
  return b;
}
function sideMult(s,b,isAtk){
  const gens=s.gens.map(OF).filter(g=>g&&g.alive);
  let lea=40,war=40,int=40,extra=0;
  if(gens.length){const so=[...gens].sort((x,y)=>y.lea-x.lea);lea=so[0].lea;war=Math.max(...gens.map(g=>g.war));int=Math.max(...gens.map(g=>g.int));extra=so.slice(1).reduce((t,g)=>t+Math.max(0,g.lea-50),0)/400;}
  let m=(0.8+lea/250+extra)*(0.95+war/1000)*(0.85+s.train/330)*(0.6+s.morale/250);
  const gr=Math.min(0.2,(s.guns||0)/Math.max(1,s.troops)*1.2);m*=1+gr*(b.weather==='雨'?0.25:1);
  if(b.phase==='field'){if(b.terrain==='m'&&!isAtk)m*=1.12;if(b.terrain==='r'&&isAtk)m*=0.92;}
  if(isAtk&&b.weather==='雪')m*=b.terrain==='m'?0.75:0.85;
  m*=s.bonus||1;if(typeof traitBattle==='function')m*=traitBattle(s,isAtk,b);
  return {m,int,lea,war};
}
function battleRound(b){
  if(b.result)return;
  b.round++;b.pr++;
  const A=b.atk,D=b.def;const a=sideMult(A,b,true),d=sideMult(D,b,false);
  const siege=b.phase==='siege';
  let ap=A.troops*a.m*rnd(0.85,1.15),dp=D.troops*d.m*rnd(0.85,1.15);
  if(siege)dp*=(1+b.castleDef/70)*(b.cmult||1);
  const lines=[];
  if(b.round===1&&b.tactic==='raid'){
    const p=clamp(0.3+(a.int-d.int)/120+(b.weather==='雨'||b.weather==='霧'?0.1:0),0.1,0.8);
    if(Math.random()<p){dp*=0.45;D.morale-=15;if(siege)b.castleDef=Math.max(0,b.castleDef-15);lines.push('奇襲成功！敵陣は混乱に陥った');}
    else{ap*=0.7;A.morale-=8;lines.push('奇襲は見破られ、味方が浮き足立った');}
  }
  if(b.special.wind&&b.round===2&&!b.special.windDone){b.special.windDone=1;if(Math.random()<0.5){const s=b.playerSide==='def'?D:A;s.bonus=1.2;lines.push('風向きが変わり、砂塵が敵の顔を打つ（摺上原の風の逸話は諸説あり）');}}
  const k=siege?0.06:0.09;
  let lossD=ap*k*(siege?0.55:1),lossA=dp*k*(siege?1.1:1);
  if(siege&&b.tactic==='starve'){lossD*=0.35;lossA*=0.3;D.morale-=1.5+2*1500/(D.troops+500);A.morale-=1.5;lines.push('包囲を続け、城内の兵糧を絶つ');}
  lossD=Math.min(D.troops,Math.round(lossD));lossA=Math.min(A.troops,Math.round(lossA));
  const fa=lossA/Math.max(1,A.troops),fd=lossD/Math.max(1,D.troops);
  A.troops-=lossA;D.troops-=lossD;
  A.morale-=fa*90+(ap<dp*0.7?4:0);D.morale-=fd*(siege?70:90)+(!siege&&dp<ap*0.7?4:0);
  if(ap>dp*1.3)A.morale+=2;if(dp>ap*1.3)D.morale+=2;
  if(siege){const dd=ap/(D.troops+800)*5*rnd(0.7,1.3)*(b.tactic==='starve'?0.3:1);b.castleDef=Math.max(0,b.castleDef-dd);}
  A.rice-=A.troops*0.04*(b.tactic==='starve'?1.5:1);
  if(A.rice<=0){A.rice=0;A.morale-=10;lines.push('攻め手の兵糧が尽き、士気が落ちる');}
  A.morale=clamp(A.morale,0,100);D.morale=clamp(D.morale,0,100);
  lines.unshift(`第${b.round}戦（${siege?'攻城':'野戦'}）　${A.label} 損害${fmt(lossA)}／${D.label} 損害${fmt(lossD)}`);
  b.log.push(...lines);
  if(b.special.withdraw&&b.round>=(b.special.wFrom||1)&&Math.random()<b.special.withdraw){b.log.push(b.special.wText||'敵軍が兵を退いた');return endBattle(b,'def');}
  const r=battleCheckEnd(b);if(r)endBattle(b,r);
}
function battleCheckEnd(b){
  const A=b.atk,D=b.def;
  if(A.troops<=0||A.morale<=12)return 'def';
  if(D.troops<=0)return 'atk';
  if(D.morale<=12){if(b.phase==='field'&&b.castle&&D.troops>50){b.phase='siege';b.pr=0;D.morale=30;b.log.push(`${D.label}は野戦に敗れ、城へ逃げ込んだ`);return null;}return 'atk';}
  if(b.phase==='siege'&&b.castleDef<=0&&D.troops<A.troops*0.35)return 'atk';
  if(b.phase==='field'&&b.pr>=b.maxField){
    if(b.castle){b.phase='siege';b.pr=0;b.log.push(`${D.label}は城に籠もった`);return null;}
    return (A.troops*A.morale>=D.troops*D.morale)?'atk':'def';
  }
  if(b.phase==='siege'&&b.pr>=b.maxSiege){b.log.push('城は落ちず、攻め手は兵を退いた');return 'def';}
  return null;
}
function endBattle(b,winner,opts){if(b.result)return;b.result=winner;finishBattle(b,winner,opts||{});}
function finishBattle(b,winner,opts){
  const A=b.atk,D=b.def;const c=b.castle?CS(b.castle):null;
  const pSide=b.playerSide;const pWin=!!pSide&&((pSide==='atk')===(winner==='atk'));
  b.summary={aLoss:A.start-A.troops,dLoss:D.start-D.troops,captured:false,pWin};
  if(c){
    if(winner==='atk'){
      fleeTroops(D.fac,c.id,D.troops*(opts.retreat?0.9:0.5));
      const occupy=Math.max(100,Math.round(A.troops*0.7));
      returnTroops(A,A.troops-occupy);
      c.troops=0;changeOwner(c.id,A.fac,'war');c.troops=occupy;c.def=Math.max(5,Math.round(b.castleDef*0.8));
      b.summary.captured=true;
    }else{
      returnTroops(A,A.troops*(opts.retreat?0.95:0.85));
      returnTroops(D,D.troops);
      if(c.owner===D.fac)c.def=Math.round(b.castleDef);
    }
  }else{returnTroops(A,A.troops);returnTroops(D,D.troops);}
  [A,D].forEach(s=>s.gens.forEach(id=>{const o=OF(id);if(o&&o.alive&&o.fac===s.fac&&(!o.castle||!own(o.castle,o.fac)))o.castle=capitalOf(o.fac);}));
  if(pSide){
    const mine=pSide==='atk'?A:D;
    if(pWin){G.prestige=clamp(G.prestige+(b.summary.captured?5:3),0,100);G.recent+=1;G.stats.wins++;mine.gens.forEach(id=>{const o=OF(id);if(o&&o.fac===PLAYER)o.loy=clamp(o.loy+3,0,100);});}
    else{G.prestige=clamp(G.prestige-4,0,100);G.recent-=1;G.stats.losses++;mine.gens.forEach(id=>{const o=OF(id);if(o&&o.fac===PLAYER&&o.id!==FA(PLAYER).leader)o.loy=clamp(o.loy-3,0,100);});
      const L=FA(PLAYER).leader;
      if(L&&mine.gens.includes(L)&&mine.start>0&&mine.troops/mine.start<0.5&&Math.random()<0.04){b.summary.leaderDead=OF(L).name;killOfficer(L,'乱戦の中で討死');}
    }
  }
  if(A.fac===PLAYER&&G.flags.sobuji&&!G.flags.sanjin&&!b.noSobuji&&alive('toyotomi')){FA('toyotomi').rel-=G.flags.sobujiRespect?8:5;b.summary.sobuji=true;}
  if(b.hook&&HOOKS[b.hook])HOOKS[b.hook](b,winner);
  const txt=`${b.title}：${winner==='atk'?A.label:D.label}の勝利`+(b.summary.captured?`（${c.name}陥落）`:'');
  log(txt,'戦');
  if(pSide&&(b.summary.captured||b.important))hist(txt,!!b.alt);
}
function quickBattle(fac,from,to,troops,gens){
  const c=CS(to);const dfac=c.owner;
  const A=mkSide(fac,troops,gens,from?[{c:from,n:troops,fac}]:[]);
  const D=mkSide(dfac,c.troops,pickAIGens(dfac,to),[{c:to,n:c.troops,fac:dfac}]);
  c.troops=0;
  const b=newBattle({title:`${c.name}の戦い`,castle:to,atk:A,def:D,terrain:from?edgeType(from,to):'p',autoPhase:true});
  let g=0;while(!b.result&&g++<40)battleRound(b);
  if(!b.result)endBattle(b,'def');
  return b;
}
function playerRetreat(){
  const b=G.battle;if(!b||b.result)return;
  const s=b.playerSide==='atk'?b.atk:b.def;s.troops=Math.round(s.troops*0.9);
  b.log.push(b.playerSide==='atk'?'退却を命じた。殿が敵の追撃を食い止める':'城を捨て、兵をまとめて落ち延びた');
  endBattle(b,b.playerSide==='atk'?'def':'atk',{retreat:true});
}
function gatherPlayer(center,ratio){
  const origins=[];let total=0;const add=(c,n)=>{n=Math.round(n);if(n<=0)return;c.troops-=n;origins.push({c:c.id,n,fac:PLAYER});total+=n;};
  const cc=CS(center);if(cc&&cc.owner===PLAYER)add(cc,cc.troops);
  facCastles(PLAYER).forEach(c=>{if(c.id===center)return;const adj=neighbors(center).includes(c.id);const r=adj?ratio:ratio*0.5;if(c.troops>300)add(c,(c.troops-200)*r);});
  return {origins,total};
}
function coalitionArmy(list){
  const origins=[];let total=0;
  list.forEach(([f,r])=>{if(!alive(f))return;facCastles(f).forEach(c=>{const n=Math.round(c.troops*r);if(n>0){c.troops-=n;origins.push({c:c.id,n,fac:f});total+=n;}});});
  return {origins,total};
}
function bestGens(n,pref){
  const ok=o=>o&&o.alive&&o.fac===PLAYER&&!o.kin&&!(o.away&&o.away>now());
  const res=[];(pref||[]).forEach(id=>{const o=OF(id);if(ok(o)&&!res.includes(id)&&res.length<n)res.push(id);});
  facOfficers(PLAYER,true).filter(ok).sort((a,b)=>b.lea-a.lea).forEach(o=>{if(res.length<n&&!res.includes(o.id))res.push(o.id);});
  res.forEach(id=>OF(id).acted=true);
  return res;
}

function pickFrontCastle(f){
  const cs=facCastles(f);
  const front=cs.filter(c=>neighbors(c.id).some(n=>{const o=CS(n).owner;return o!==f&&hostile(f,o);}));
  const arr=front.length?front:cs;return arr.sort((a,b)=>a.troops-b.troops)[0];
}
function aiTurn(){
  Object.values(G.factions).filter(F=>F.alive&&!F.central&&F.id!==PLAYER).forEach(F=>{
    const cs=facCastles(F.id);if(!cs.length)return;
    F.gold+=cs.reduce((t,c)=>t+c.comm*0.8,0);
    if(G.month===9)F.rice+=cs.reduce((t,c)=>t+c.agri*11,0);
    F.rice-=facTroops(F.id)*0.05;
    if(F.rice<0){F.rice=0;cs.forEach(c=>c.troops=Math.floor(c.troops*0.97));}
    cs.forEach(c=>{if(Math.random()<0.2&&c.agri<c.agriMax)c.agri++;if(Math.random()<0.2&&c.comm<c.commMax)c.comm++;if(c.def<c.maxDef)c.def=Math.min(c.maxDef,c.def+1);c.pop=Math.min(c.popMax,Math.round(c.pop*1.002));if(c.train<70&&Math.random()<0.15)c.train+=2;});
    if(F.gold>250){const c=pickFrontCastle(F.id);const cap=Math.round(c.pop*0.16)+300;if(c.troops<cap){const add=Math.min(ri(150,450),cap-c.troops,Math.floor((F.gold-100)/0.45));if(add>0){c.troops+=add;F.gold-=add*0.45;}}}
    aiAttack(F);
  });
  // AI同士の開戦・和睦
  if(Math.random()<0.03){
    const pairs=[];EDGES.forEach(([a,b])=>{const x=CS(a).owner,y=CS(b).owner;if(x!==y&&x!==PLAYER&&y!==PLAYER&&!FA(x).central&&!FA(y).central&&!aiAtWar(x,y)&&!aiAllied(x,y))pairs.push([x,y]);});
    if(pairs.length){const p=pick(pairs);G.aiWars.push(p);log(`${FA(p[0]).name}と${FA(p[1]).name}が争い始めた`,'戦');}
  }
  G.aiWars=G.aiWars.filter(p=>{if(!alive(p[0])||!alive(p[1]))return false;if(Math.random()<0.03){log(`${FA(p[0]).name}と${FA(p[1]).name}が和睦した`,'外');return false;}return true;});
}
function aiAttack(F){
  if(Math.random()>F.aggr)return;
  let best=null;const winter=G.month===12||G.month<=2;
  facCastles(F.id).forEach(c=>{
    if(c.troops<700)return;
    neighbors(c.id).forEach(nid=>{
      const n=CS(nid);const o=n.owner;if(o===F.id||!hostile(F.id,o))return;
      if(winter&&edgeType(c.id,nid)==='m'&&Math.random()<0.8)return;
      const send=Math.floor(c.troops*0.7);const ratio=send/((n.troops+100)*(1+n.def/70));
      if(ratio>1.15&&(!best||ratio>best.ratio))best={c,n,send,ratio};
    });
  });
  if(!best)return;
  best.c.troops-=best.send;
  const gens=pickAIGens(F.id,best.c.id);
  const it={fac:F.id,from:best.c.id,to:best.n.id,troops:best.send,gens};
  if(best.n.owner===PLAYER)G.queue.push(Object.assign({k:'attack'},it));
  else if(FA(best.n.owner).ally&&Math.random()<0.5)G.queue.push(Object.assign({k:'aid'},it));
  else quickBattle(F.id,best.c.id,best.n.id,best.send,gens);
}

function officerMonthly(){
  const L=FA(PLAYER).leader;
  facOfficers(PLAYER,true).forEach(o=>{
    if(o.id===L){o.loy=100;return;}
    const isGov=Object.values(G.castles).some(c=>c.gov===o.id&&c.owner===PLAYER)||Object.values(G.roles||{}).includes(o.id);
    let d=(G.prestige-40)/50-o.amb/180+(isGov?0.4:0)+G.recent*0.2+(now()-o.lastReward>12?-0.6:0)+rnd(-0.4,0.4);
    if(typeof traitLoy==='function')d=traitLoy(o,d);
    o.loy=clamp(o.loy+d,0,100);
    if(o.loy<30&&Math.random()<(30-o.loy)/200){
      const gc=Object.values(G.castles).find(c=>c.gov===o.id&&c.owner===PLAYER);
      if(gc&&o.amb>=60){
        const en=neighbors(gc.id).map(n=>CS(n).owner).filter(f=>f!==PLAYER&&!FA(f).central);
        const tgt=en.length?pick(en):null;
        if(tgt){o.fac=tgt;changeOwner(gc.id,tgt,'betray');G.queue.push({k:'notice',title:'謀反',text:`${o.name}が謀反！ ${gc.name}は${FA(tgt).name}に寝返った。<br>家臣の忠誠には常に気を配る必要がある。`});hist(`${o.name}、${gc.name}ごと${FA(tgt).name}へ寝返る`,true);return;}
      }
      o.fac='ronin';Object.values(G.castles).forEach(c=>{if(c.gov===o.id)c.gov=null;});for(const k in G.roles)if(G.roles[k]===o.id)delete G.roles[k];o.castle=null;
      G.queue.push({k:'notice',title:'家臣の出奔',text:`${o.name}が伊達家を出奔した。<br>褒美や城主任命で忠誠を保つことができる。`});log(`${o.name}が出奔`,'人');
    }
  });
  G.recent*=0.8;
}
function naturalDeaths(){

    if(!o.alive||!o.born||['masamune','hideyoshi','ieyasu','kojiro'].includes(o.id))return;
    const a=ageOf(o);if(a>58&&Math.random()<(a-58)*0.0006){killOfficer(o.id,'病没');if(o.fac===PLAYER||o.prevFac===PLAYER)G.queue.push({k:'notice',title:'訃報',text:`${o.name}が病で世を去った（享年${a}）。`});}
  });
}
function diploMonthly(){
  const pp=facPower(PLAYER);
  Object.values(G.factions).forEach(F=>{
    if(!F.alive||F.id===PLAYER)return;
    if(F.ceasefire>0)F.ceasefire--;
    if(!F.war){
      if(F.ally)F.rel=Math.max(F.rel,40);
      if(F.marriage)F.rel+=0.5;if(F.trade)F.rel+=0.3;
      if(!F.ally&&!F.marriage)F.rel+=Math.sign(F.base-F.rel)*0.4;
      if(!F.central&&!F.ally&&pp>2*facPower(F.id)&&adjacentToPlayer(F.id))F.rel-=0.7;
    }
    F.rel=clamp(F.rel,-100,100);
    if(!F.central&&!F.war&&!F.ally&&F.ceasefire<=0&&F.rel<=-50&&adjacentToPlayer(F.id)&&Math.random()<0.1){
      declareWar(F.id);G.queue.push({k:'notice',title:'宣戦布告',text:`${F.name}（当主 ${leaderName(F.id)}）が伊達家に宣戦布告してきた！<br>国境の城の守りを固めよ。`});
    }
  });
}

const EV={};
function defEv(o){EV[o.id]=o;}
function checkEvents(){
  const n=now();
  for(const id in EV){const e=EV[id];
    if(G.flags['ev_'+id])continue;
    if(e.from&&n<dnum(e.from[0],e.from[1]))continue;
    if(e.to&&n>dnum(e.to[0],e.to[1]))continue;
    let ok=true;try{ok=!e.cond||e.cond();}catch(err){ok=false;}
    if(!ok)continue;
    G.flags['ev_'+id]=1;G.queue.push({k:'event',id});
  }

function hitotoriBattle(mode){
  const co=coalitionArmy([['satake',0.45],['ashina',0.4],['nikaido',0.4],['iwaki',0.3],['shirakawa',0.3]]);
  const pl=gatherPlayer('omori',0.7);
  const A=mkSide('satake',co.total,['yoshishige','morikiyo'],co.origins,{label:'佐竹・蘆名ら連合軍'});
  const D=mkSide(PLAYER,pl.total,bestGens(3,['masamune','shigezane','yoshinao']),pl.origins);
  G.battle=newBattle({title:'人取橋の戦い',castle:mode==='siege'?'omori':null,atk:A,def:D,terrain:'r',playerSide:'def',hook:'hitotori',important:true,
    special:{withdraw:mode==='siege'?0.08:0.28,wFrom:2,wText:'連合軍の陣中に動揺が走り、佐竹勢が兵を退き始めた（撤退の理由には諸説あり）'}});
  return null;
}

  else{markHist('hitotori','changed','伊達勢は人取橋で敗れた');b.alt=true;hist('人取橋の戦いで伊達勢が敗北',true);G.prestige-=6;
    if(!b.castle&&own('omori',PLAYER)){const c=CS('omori');fleeTroops(PLAYER,'omori',c.troops*0.7);c.troops=0;changeOwner('omori','ashina','war');c.troops=1500;b.log.push('勢いに乗る連合軍は大森城を奪った');}}
};

  if(mode==='surrender'){const cap=capitalOf(PLAYER);const rest=facCastles(PLAYER).filter(c=>!list.includes(c)&&c.id!==cap);list=list.concat(rest.slice(0,Math.floor(rest.length/2)));}

}

function randomEvents(){
  const pcs=facCastles(PLAYER);if(!pcs.length)return;
  if(G.month===8&&!G.flags['harv'+G.year]){G.flags['harv'+G.year]=1;const r=Math.random();
    if(r<0.12){G.harvestMod=0.65;G.queue.push({k:'notice',title:'冷害（やませ）',text:'冷たい東風が続き、稲の育ちが悪い。今年の収穫は大きく落ち込みそうだ。<br>治水を進めた城ほど被害は小さい。',type:'ランダム'});}
    else if(r<0.26){G.harvestMod=1.25;G.queue.push({k:'notice',title:'豊作の兆し',text:'天候に恵まれ、稲穂がよく実っている。今年は豊作になりそうだ。',type:'ランダム'});}}
  if(G.month>=6&&G.month<=8&&Math.random()<0.15){const c=pick(pcs);if(Math.random()*100>c.flood)G.queue.push({k:'minor',id:'flood',data:{c:c.id}});}
  if(Math.random()<0.02){const c=pick(pcs);c.pop=Math.round(c.pop*0.93);c.loy=Math.max(0,c.loy-4);G.queue.push({k:'notice',title:'疫病',text:`${c.name}の城下で疫病が流行し、人口が減った。`,type:'ランダム'});}
  const po=POOL_OFFER.find(([id,y])=>{const o=OF(id);return o&&o.alive&&o.fac==='pool'&&G.year>=y;});
  if(po&&Math.random()<0.15)G.queue.push({k:'minor',id:'recruit',data:{o:po[0]}});
  aiProposals();
}
function aiProposals(){
  let n=0;const pp=facPower(PLAYER);
  shuffle(Object.values(G.factions).filter(f=>f.alive&&!f.central&&f.id!==PLAYER&&!f.hidden)).forEach(F=>{
    if(n)return;const adj=adjacentToPlayer(F.id);const fp=facPower(F.id);
    if(!F.war&&!F.ally&&F.rel>=45&&Math.random()<0.08){G.queue.push({k:'prop',type:'alliance',fac:F.id});n++;return;}
    if(!F.war&&!F.marriage&&F.rel>=30&&Math.random()<0.035){G.queue.push({k:'prop',type:'marriage',fac:F.id});n++;return;}
    if(F.war&&fp<pp*0.6&&Math.random()<0.1){G.queue.push({k:'prop',type:'ceasefire',fac:F.id});n++;return;}
    if(!F.war&&!F.ally&&F.rel<0&&fp>pp*1.2&&adj&&Math.random()<0.06){G.queue.push({k:'prop',type:'demand',fac:F.id});n++;return;}
    if(!F.war&&fp<pp*0.25&&F.rel>=20&&adj&&Math.random()<0.05){G.queue.push({k:'prop',type:'submit',fac:F.id});n++;return;}
    if(!F.war&&!F.trade&&F.rel>=10&&Math.random()<0.03){G.queue.push({k:'prop',type:'trade',fac:F.id});n++;}
  });
  if(G.year>=1586&&G.year<1590&&alive('toyotomi')&&!G.flags.refuse&&Math.random()<0.07)G.queue.push({k:'prop',type:'toyotomi',fac:'toyotomi'});
}

function pickMinor(){

function modal(title,html,buttons,opt){
  opt=opt||{};
  $('#mTitle').innerHTML=title;$('#mBody').innerHTML=html;
  const f=$('#mFoot');f.innerHTML='';
  (buttons||[]).forEach(b=>{const e=document.createElement('button');e.className='btn '+(b.cls||'');e.innerHTML=b.label;if(b.disabled)e.disabled=true;e.onclick=()=>{if(b.on)b.on();};f.appendChild(e);});
  $('#mClose').style.display=opt.noClose?'none':'';
  UI.onClose=opt.onClose||null;UI.modalLocked=!!opt.noClose;
  $('#modal .sheet').className='sheet'+(opt.wide?' wide':'');
  $('#modal').classList.remove('hidden');$('#mBody').scrollTop=0;
}
function closeModal(){$('#modal').classList.add('hidden');UI.modalLocked=false;const cb=UI.onClose;UI.onClose=null;if(cb)cb();}

function launchAttack(from,to,gens,troops,rice,tactic,ask){
  const src=CS(from),tgt=CS(to),dfac=tgt.owner,P=FA(PLAYER);useAP();
  if(!FA(dfac).war)declareWar(dfac);
  gens.forEach(id=>OF(id).acted=true);
  P.rice-=rice;src.troops-=troops;
  const origins=[{c:from,n:troops,fac:PLAYER}];let total=troops;const notes=[];
  if(ask)Object.values(G.factions).filter(f=>f.alive&&f.ally&&!f.central).forEach(f=>{const ac=neighbors(to).map(CS).find(x=>x.owner===f.id&&x.troops>400);if(!ac)return;
    if(Math.random()<0.45+f.rel/200){const n=Math.round(ac.troops*0.35);ac.troops-=n;origins.push({c:ac.id,n,fac:f.id});total+=n;notes.push(`${f.name}が${fmt(n)}の援軍を送ってきた`);}else notes.push(`${f.name}は援軍を見送った`);});
  if(tactic==='plot'){
    P.gold-=300;const g=OF(gens[0]);const gov=tgt.gov&&OF(tgt.gov);
    const p=clamp(0.12+(g.int-(gov?gov.int:50))/150+G.prestige/300+(gov?(60-gov.loy)/150:0.05),0.05,0.6);
    if(Math.random()<p){
      origins.forEach(o=>{if(own(o.c,o.fac))CS(o.c).troops+=o.n;});P.rice+=rice;
      if(gov&&gov.fac===dfac){gov.fac=PLAYER;gov.loy=55;}
      const keep=Math.round(tgt.troops*0.6);tgt.troops=0;changeOwner(to,PLAYER,'plot');tgt.troops=keep;
      if(G.flags.sobuji&&!G.flags.sanjin&&alive('toyotomi'))FA('toyotomi').rel-=3;
      hist(`調略により${tgt.name}が伊達家に降る`,true);G.prestige+=3;
      resultModal('調略成功',`${g.name}の調略が実り、${tgt.name}は戦わずして伊達家に降った！`);return;
    }
    notes.push(`${g.name}の調略は失敗した。力攻めに切り替える`);tactic='normal';
  }
  const A=mkSide(PLAYER,total,gens,origins,{rice});
  const D=mkSide(dfac,tgt.troops,pickAIGens(dfac,to),[{c:to,n:tgt.troops,fac:dfac}]);tgt.troops=0;
  const b=newBattle({title:`${tgt.name}攻め`,castle:to,atk:A,def:D,terrain:edgeType(from,to),tactic,playerSide:'atk',autoPhase:true});
  notes.forEach(t=>b.log.push(t));
  G.battle=b;showBattle();
}

function diploChance(type,F,env){
  const e=env?OF(env):null;const int=e?e.int:40,pol=e?e.pol:40;const pr=G.prestige;const ratio=facPower(PLAYER)/Math.max(1,facPower(F.id));
  switch(type){
   case 'alliance':return clamp((F.rel-30)/60+(pr-30)/200+(int-60)/200,0,0.95);
   case 'marriage':return clamp(0.35+(F.rel-30)/80+(pol-60)/200,0,0.95);
   case 'trade':return clamp(0.4+F.rel/100+(pol-50)/200,0,0.95);
   case 'ceasefire':return clamp(0.2+(ratio-1)*0.2+(int-50)/250+(F.rel+60)/300,0.05,0.9);
   case 'surrender':{const L=F.leader?OF(F.leader):null;return clamp((ratio-2.5)*0.12+(F.rel+40)/300+pr/400+(int-60)/300-(L&&L.alive?L.amb/400:0),0,0.75);}
  }
  return 1;
}

   fs.map(f=>{const st=relStage(f.id);return `<button class="row" data-f="${f.id}"><span class="dotc" style="background:${f.color}"></span><span class="grow"><span class="nm">${f.name}</span> <span class="badge ${st[1]}">${st[0]}</span>${f.marriage?'<span class="badge good">婚姻</span>':''}${f.trade?'<span class="badge neu">交易</span>':''}${f.central?'<span class="badge hist">中央</span>':''}<div class="meta">当主 ${leaderName(f.id)}／${f.central?'動員力（目安）'+fmt(facPower(f.id)):'城'+facCastles(f.id).length+'・兵'+fmt(facTroops(f.id))}</div><div class="relbar"><i style="left:${(f.rel+100)/2}%"></i></div></span></button>`;}).join(''),[]);
  document.querySelectorAll('#mBody .row').forEach(b=>b.onclick=()=>diploModal(b.dataset.f));

function diploModal(fid,env){

  if(!F.central||fid==='hojo'){
    acts.push({id:'alliance',name:'同盟',desc:'友好（関係50以上）が必要',ok:!F.war&&!F.ally&&F.rel>=50,note:pc(diploChance('alliance',F,env))});
  }
  if(!F.central){
    acts.push({id:'marriage',name:'婚姻',desc:`伊達一門の姫を嫁がせる（残り${G.brides}人）。関係30以上`,ok:!F.war&&!F.marriage&&F.rel>=30&&G.brides>0,note:pc(diploChance('marriage',F,env))});
    acts.push({id:'trade',name:'交易',desc:'毎月の金収入が増える。関係0以上',ok:!F.war&&!F.trade&&F.rel>=0,note:pc(diploChance('trade',F,env))});
    acts.push({id:'ceasefire',name:'停戦',desc:'交戦中の相手と12か月停戦',ok:F.war&&P.gold>=100,note:'金100／'+pc(diploChance('ceasefire',F,env))});
    acts.push({id:'surrender',name:'降伏勧告',desc:'兵力差が大きいほど成功しやすい',ok:!F.ally,note:pc(diploChance('surrender',F,env))});
    acts.push({id:'war',name:'宣戦布告',desc:'交戦状態に入る（行動回数を使わない）',ok:!F.war,free:1,note:F.ally?'同盟破棄になる':''});
    if(F.ally)acts.push({id:'break',name:'同盟破棄',desc:'信用を大きく失う',ok:true,free:1,note:''});
  }
  if(fid==='toyotomi'){
    acts.push({id:'vassal',name:'従属を申し出る',desc:'豊臣政権の傘下に入る意思を示す',ok:!G.flags.vassalToyotomi&&!F.war,note:'関係 +30'});
    if(F.war)acts.push({id:'tsurrender',name:'降伏する',desc:'抵抗をやめ厳しい処分を受け入れる',ok:true,note:''});
  }
  const html=`<div style="display:flex;gap:10px;align-items:center">${F.leader&&OF(F.leader)?faceHTML(F.leader):`<span class="dotc" style="background:${F.color};width:18px;height:18px"></span>`}<div><div class="nm" style="font-family:var(--serif);font-size:18px;font-weight:800">${F.name} <span class="badge ${st[1]}">${st[0]}</span></div><div class="meta" style="font-size:13px;color:var(--ink2)">当主 ${leaderName(fid)}／関係値 ${Math.round(F.rel)}${F.ceasefire>0?`／停戦 残り${F.ceasefire}か月`:''}${F.marriage?'／婚姻あり':''}${F.trade?'／交易中':''}</div></div></div>
   <div class="relbar" style="margin:10px 0"><i style="left:${(F.rel+100)/2}%"></i></div>
   ${F.central?`<div class="note">中央の大勢力。推定動員力（ゲーム上の目安）${fmt(facPower(fid))}。</div>`:`<div class="kv"><div><span>城</span><b>${facCastles(fid).length}</b></div><div><span>兵力</span><b>${facTroopsShown(fid)}</b></div><div><span>伊達家との兵力比</span><b>${facKnown(fid)?(facPower(PLAYER)/Math.max(1,facPower(fid))).toFixed(1)+'倍':'不明'}</b></div></div>`}
   ${G.ap>0?`<div class="note">外交は行動を1回使う（今月の残り ${G.ap}回）。</div>`:'<div class="note" style="color:var(--bad)">今月の行動は残っていない。【次の月へ】で回復する。</div>'}<label class="form"><span>使者</span><select id="dE">${av.map(o=>opt(o.id,`${o.name}（知${o.int} 政${o.pol}）`,env)).join('')||'<option value="">行動可能な武将なし</option>'}</select></label>
   <div class="acts">${acts.map(a=>`<button class="act" data-a="${a.id}" ${a.ok&&env&&(G.ap>0||a.free)?'':'disabled'}><b>${a.name}</b><small>${a.desc}${a.note?'<br>'+a.note:''}</small></button>`).join('')}</div>`;
  modal(`外交：${F.name}`,html,[{label:'一覧へ戻る',on:gaikoModal}]);
  $('#dE').onchange=ev=>diploModal(fid,ev.target.value);
  document.querySelectorAll('#mBody .act').forEach(b=>b.onclick=()=>doDiplo(fid,b.dataset.a,env));
}
function doDiplo(fid,type,env){
  const F=FA(fid);const P=FA(PLAYER);const o=OF(env);if(!o)return;
  const r=x=>{if(!['war','break'].includes(type))useAP();autosave(true);renderAll();modal('外交の結果',`<div class="evtext">${x}</div>`,[{label:'外交を続ける',on:()=>diploModal(fid)},{label:'閉じる',cls:'pri',on:closeModal}]);};
  const roll=t=>Math.random()<diploChance(t,F,env);
  switch(type){
   case 'gift':{P.gold-=300;const v=Math.round(10*(0.5+o.int/100));F.rel+=v;return r(`${o.name}が贈り物を届けた。${F.name}との関係が${v}上がった。`);}
   case 'alliance':if(roll('alliance')){F.ally=true;F.rel+=10;hist(`伊達家、${F.name}と同盟`);return r(`${F.name}との同盟が成立した！`);}F.rel-=3;return r(`${F.name}は同盟を断った。`);
   case 'marriage':if(roll('marriage')){F.marriage=true;F.rel+=20;G.brides--;hist(`伊達家、${F.name}と婚姻を結ぶ`,true);return r(`婚姻が成立した。両家は縁戚となった。<br><small>※嫁ぐ姫はゲーム上の伊達一門の女性で、特定の実在人物ではありません。</small>`);}F.rel-=3;return r(`${F.name}は婚姻を断った。`);
   case 'trade':if(roll('trade')){F.trade=true;F.rel+=3;return r(`${F.name}との交易が始まった。`);}return r(`${F.name}は交易を断った。`);
   case 'ceasefire':P.gold-=100;if(roll('ceasefire')){makePeace(fid,12);return r(`${F.name}との停戦が成立した。`);}return r(`${F.name}は停戦に応じなかった。`);
   case 'surrender':if(roll('surrender')){absorbFaction(fid);G.prestige+=4;return r(`${F.name}は伊達家に降った！`);}F.rel-=10;return r(`${F.name}は降伏勧告をはねつけた。`);
   case 'war':declareWar(fid);return r(`${F.name}に宣戦布告した。`);
   case 'break':breakAlliance(fid);return r(`${F.name}との同盟を破棄した。`);
   case 'vassal':G.flags.vassalToyotomi=1;F.rel+=30;hist('伊達家、豊臣政権への従属を表明',true);return r('豊臣家への従属を表明した。上方との関係は安定するだろう。');
   case 'tsurrender':return r(surrenderToyotomi());
  }
}

/* ================= セーブ／ロード ================= */
function storage(){try{const k='__t';localStorage.setItem(k,'1');localStorage.removeItem(k);return localStorage;}catch(e){return null;}}
function saveGame(slot){const s=storage();if(!s||!G)return false;try{s.setItem(SAVE_KEY+'_'+slot,JSON.stringify({savedAt:Date.now(),G}));return true;}catch(e){toast('保存に失敗しました');return false;}}
function latestSave(){let best=null,slot=null;['auto','1','2','3'].forEach(s=>{const d=readSave(s);if(d&&(!best||d.savedAt>best.savedAt)){best=d;slot=s;}});return slot;}

function evalEnding(){
  if(onMapCastles().every(c=>c.owner===PLAYER))return 'unify';
  if(G.flags.refuse||G.flags.independent)return 'independent';
  if(kokudaka(PLAYER)>=600000)return 'oshu_haou';
  if(G.flags.sanjin)return 'toyotomi_daimyo';
  return 'survive';
}

function showEnding(id,canContinue){
  const e=ENDINGS.find(x=>x.id===id);G.flags.achieved=G.flags.achieved||[];if(!G.flags.achieved.includes(id))G.flags.achieved.push(id);

const P_=(lat,lon)=>[(lon-LON0)*KX,(LAT0-lat)*KY];
const pathD=(arr,close)=>arr.map(([a,o],i)=>{const [x,y]=P_(a,o);return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);}).join('')+(close?'Z':'');
function buildMap(){
  let s=`<defs><clipPath id="landClip"><path d="${pathD(COAST,true)}"/></clipPath>
   <pattern id="wave" width="28" height="14" patternUnits="userSpaceOnUse"><path d="M0 9 Q7 3 14 9 T28 9" class="wave"/></pattern>
   <marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" class="arrhead"/></marker></defs>
   <rect x="-400" y="-400" width="${MAP_W+800}" height="${MAP_H+800}" class="sea"/><rect x="-400" y="-400" width="${MAP_W+800}" height="${MAP_H+800}" fill="url(#wave)"/>
   <path d="${pathD(COAST,true)}" class="land"/><g id="mTerr" clip-path="url(#landClip)"></g>`;
  BORDERS.forEach(b=>s+=`<path d="${pathD(b)}" class="border"/>`);
  s+=`<path d="${pathD(SPINE)}" class="spine"/>`;
  PROV.forEach(([n,a,o])=>{const [x,y]=P_(a,o);s+=`<text x="${x}" y="${y}" class="prov">${n}</text>`;});
  LAKES.forEach(([n,a,o,rx,ry])=>{const [x,y]=P_(a,o);s+=`<ellipse cx="${x}" cy="${y}" rx="${rx*KX}" ry="${ry*KY}" class="lake"/><text x="${x}" y="${y+ry*KY+12}" class="riverT" text-anchor="middle">${n}</text>`;});
  RIVERS.forEach(r=>{s+=`<path d="${pathD(r.p)}" class="river"/>`;const [x,y]=P_(r.l[0],r.l[1]);s+=`<text x="${x}" y="${y}" class="riverT">${r.n}</text>`;});
  PEAKS.forEach(([n,a,o])=>{const [x,y]=P_(a,o);s+=`<path d="M${x-7} ${y+5}L${x} ${y-7}L${x+7} ${y+5}Z" class="peak"/><text x="${x}" y="${y+17}" class="peakT">${n}</text>`;});
  let [x,y]=P_(38.4,142.0);s+=`<text x="${x}" y="${y}" class="seaT">太平洋</text>`;[x,y]=P_(39.3,139.2);s+=`<text x="${x}" y="${y}" class="seaT">日本海</text>`;
  [x,y]=P_(37.35,138.75);s+=`<text x="${x}" y="${y}" class="offT">← 越後（上杉）</text>`;[x,y]=P_(36.42,139.5);s+=`<text x="${x}" y="${y}" class="offT">↓ 関東（北条）・上方（豊臣）</text>`;
  s+=`<g id="mEdges"></g><g id="mRoute"></g><g id="mCastles"></g>`;
  $('#map').innerHTML=s;
  // 伊達家の進路
  const rp=['yonezawa','omori','shiroishi','chiyo'].map(id=>{const c=CASTLES.find(z=>z[0]===id);return [c[3],c[4]];});
  const [rx,ry]=P_(37.86,140.33);
  $('#mRoute').innerHTML=`<path d="${pathD(rp)}" class="route" marker-end="url(#arr)"/><text x="${rx}" y="${ry}" class="routeT" transform="rotate(-28 ${rx} ${ry})">伊達家の進路</text>`;
}

function maxAP(){return 3+(facCastles(PLAYER).length>=10?1:0)+(G.prestige>=60?1:0);}
function useAP(){G.ap=Math.max(0,(G.ap||0)-1);}
function migrate(g){
  Object.values(g.castles).forEach(c=>{if(!c.lv)c.lv={agri:1,comm:1,castle:1,order:1};if(!c.b)c.b={agri:c.agri,comm:c.comm,def:c.maxDef};});
  g.roles=g.roles||{};g.intel=g.intel||{};g.settings=g.settings||{theme:'auto',big:false};g.notes=g.notes||[];
  if(g.ap==null)g.ap=3;g.v=GAME_VERSION;return g;
}
function cleanRoles(){for(const k in G.roles){const o=OF(G.roles[k]);if(!o||!o.alive||o.fac!==PLAYER)delete G.roles[k];}}
function roleOf(id){return ROLES.find(r=>G.roles[r.id]===id)||null;}
function roleBonusFor(rid,o){const r=ROLES.find(x=>x.id===rid);return o?Math.max(0,Math.round((r.stat(o)-50)*0.5)):0;}
function roleBonus(rid){const id=G.roles[rid];const o=id&&OF(id);if(!o||!o.alive||o.fac!==PLAYER||(o.away&&o.away>now()))return 0;return roleBonusFor(rid,o);}
function assignRole(rid,oid){for(const k in G.roles)if(G.roles[k]===oid)delete G.roles[k];G.roles[rid]=oid;autosave(true);}
function bestForRole(rid,exclude){const r=ROLES.find(x=>x.id===rid);const L=FA(PLAYER).leader;
  return facOfficers(PLAYER,true).filter(o=>o.id!==L&&!roleOf(o.id)&&!(exclude||[]).includes(o.id)).sort((a,b)=>r.stat(b)-r.stat(a))[0]||null;}
function autoAssignRoles(){let n=0;ROLES.forEach(r=>{if(!G.roles[r.id]){const o=bestForRole(r.id);if(o){G.roles[r.id]=o.id;n++;}}});autosave(true);return n;}
function apNote(){return `<div class="note">${G.ap>0?`今月の行動：残り <b>${G.ap}</b> 回（最大${maxAP()}回）`:'<b style="color:var(--bad)">今月の行動は終わりました。【次の月へ】で回復します。</b>'}</div>`;}
function dirOf(fid){const cap=CS(capitalOf(PLAYER));const cs=facCastles(fid);if(!cap||!cs.length)return '';
  const la=cs.reduce((t,c)=>t+c.lat,0)/cs.length-cap.lat,lo=cs.reduce((t,c)=>t+c.lon,0)/cs.length-cap.lon;
  return Math.abs(la)>Math.abs(lo)*0.8?(la>0?'北':'南'):(lo>0?'東':'西');}

let saveT=0;
function autosave(show){if(!G)return;const ok=saveGame('auto');if(ok&&show){const e=$('#saveInd');e.classList.add('show');clearTimeout(saveT);saveT=setTimeout(()=>e.classList.remove('show'),1400);}}
function loadGame(slot){const d=readSave(slot);if(!d)return false;G=d.G;UI.sel=null;$('#title').classList.add('hidden');applySettings();setMapMode('tohoku');renderAll();
  if(G.ended&&!G.freePlay){setTimeout(()=>showEnding(evalEnding(),true),50);return true;}

/* ================= 状況・おすすめ ================= */
function threats(){const r=[];facCastles(PLAYER).forEach(c=>{neighbors(c.id).map(CS).forEach(n=>{if(n.owner!==PLAYER&&FA(n.owner).war&&n.troops>c.troops*1.3&&!r.find(x=>x.c===c))r.push({c,e:n});});});return r.slice(0,3);}
function bestAttack(){let best=null;facCastles(PLAYER).forEach(c=>{if(c.troops<500)return;neighbors(c.id).forEach(n=>{const t=CS(n);if(t.owner===PLAYER||!FA(t.owner).war)return;const r=c.troops*0.8/((t.troops+100)*(1+t.def/70));if(!best||r>best.r)best={f:c,t,r};});});return best;}
function cheapestUpgrade(){let best=null;facCastles(PLAYER).forEach(c=>['agri','comm','order','castle'].forEach(k=>{const lv=c.lv[k];if(lv>=5)return;const cost=LV_COST[lv];if(!best||cost<best.cost||(cost===best.cost&&c.agri>best.c.agri))best={c,k,cost,name:CATS.find(x=>x.id===k).name};}));return best;}
function issues(){
  const P=FA(PLAYER);const out=[];const cons=monthlyRice();
  if(G.year===1590&&G.month<=6&&!G.flags.sanjin&&!G.flags.refuse)out.push(['bad','豊臣秀吉が小田原への参陣を求めています。']);
  if(P.rice<cons*3&&G.month!==9)out.push(['bad','米が不足しています。']);
  if(P.gold<200)out.push(['warn','金が不足しています。']);
  const low=facOfficers(PLAYER,true).filter(o=>o.loy<40&&o.id!==P.leader);
  if(low.length)out.push(['bad',`家臣の忠誠度が低下しています（${low.slice(0,2).map(o=>o.name).join('・')}${low.length>2?'ほか':''}）。`]);
  threats().forEach(t=>out.push(['bad',`${t.c.name}が${FA(t.e.owner).name}に狙われています。`]));
  facCastles(PLAYER).filter(c=>c.def<c.maxDef*0.6).slice(0,1).forEach(c=>out.push(['warn',`${c.name}が傷んでいます（内政 → 城 → 修復）。`]));
  if(!Object.keys(G.roles).length&&facOfficers(PLAYER,true).length>1)out.push(['warn','奉行が任命されていません（人物タブから任命できます）。']);
  const wars=Object.values(G.factions).filter(f=>f.alive&&f.war);
  (G.notes||[]).slice(-2).forEach(n=>out.push(['info',n+'。']));
  if(!out.some(x=>x[0]==='bad'||x[0]==='warn'))out.unshift(['ok','現在、大きな問題はありません。']);
  out.push(wars.length?['info',`交戦中：${wars.map(f=>f.short).join('・')}`]:['ok','敵対勢力なし（交戦中の相手はいません）。']);
  const order={bad:0,warn:1,info:2,ok:3};return out.sort((a,b)=>order[a[0]]-order[b[0]]);
}
function recs(){
  const P=FA(PLAYER);const out=[];const cap=capitalOf(PLAYER);const cons=monthlyRice();
  if(G.ap<=0){out.push({t:'今月の行動はすべて終わりました。【次の月へ】進みましょう。',l:'次の月へ',f:()=>{hideModal();onCmd('next');}});return out;}
  if(G.year===1590&&G.month<=6&&!G.flags.sanjin&&!G.flags.refuse)out.push({t:'豊臣秀吉が小田原への参陣を求めています。月を進めると決断の場面が来ます。金を600ほど残しておくと選択肢が広がります。',l:'評定を開く',f:hyojoModal});
  const th=threats()[0];if(th&&P.gold>=150)out.push({t:`${th.c.name}が${FA(th.e.owner).name}に狙われています。兵士を募集して守りを固めることをおすすめします。`,l:'兵を募る',f:()=>gunjiModal('recruit',{c:th.c.id})});
  if(P.rice<cons*4&&G.month!==9){const c=facCastles(PLAYER).filter(x=>x.lv.agri<5).sort((a,b)=>b.agri-a.agri)[0];out.push({t:'米が不足しています。農業を強化することをおすすめします。',l:'農業を見る',f:()=>naiseiModal(c?c.id:cap)});}
  const low=facOfficers(PLAYER,true).filter(o=>o.loy<45&&o.id!==P.leader).sort((a,b)=>a.loy-b.loy)[0];
  if(low&&P.gold>=100)out.push({t:`${low.name}の忠誠度が下がっています（${Math.round(low.loy)}）。褒美を与えることをおすすめします。`,l:'武将を見る',f:()=>officerModal(low.id)});
  const bad=Object.values(G.factions).filter(f=>f.alive&&!f.central&&!f.war&&!f.ally&&f.rel<=-20&&adjacentToPlayer(f.id)).sort((a,b)=>a.rel-b.rel)[0];
  if(bad&&P.gold>=300)out.push({t:`${dirOf(bad.id)}の${bad.name}との関係が悪化しています。外交（贈答）を行うことをおすすめします。`,l:'外交へ',f:()=>diploModal(bad.id)});
  const role=ROLES.find(r=>!G.roles[r.id]);if(role){const cand=bestForRole(role.id);if(cand)out.push({t:`${role.name}が空いています。${cand.name}を任命すると${role.eff}が＋${roleBonusFor(role.id,cand)}%になります（金・行動は不要）。`,l:'任命する',f:()=>{assignRole(role.id,cand.id);toast(`${cand.name}を${role.name}に任命した`);renderAll();recModal();}});}
  const atk=bestAttack();if(atk&&atk.r>=1.6)out.push({t:`${atk.t.name}（${FA(atk.t.owner).name}）は守りが手薄です。攻め落とす好機です。`,l:'出陣を準備',f:()=>gunjiModal('attack',{from:atk.f.id,to:atk.t.id})});
  const foe=Object.values(G.factions).filter(f=>f.alive&&f.war&&!f.central).reduce((m,f)=>Math.max(m,facTroops(f.id)),0);
  if(foe>facTroops(PLAYER)*1.2&&P.gold>=200)out.push({t:'敵の兵力が伊達家を上回っています。兵士を募集することをおすすめします。',l:'兵を募る',f:()=>gunjiModal('recruit')});
  const u=cheapestUpgrade();if(u&&P.gold>=u.cost+150)out.push({t:`金に余裕があります。${u.c.name}の${u.name}を発展させましょう（金${u.cost}）。`,l:'内政へ',f:()=>naiseiModal(u.c.id)});
  if(!out.length)out.push({t:'大きな問題はありません。このまま【次の月へ】進んでも大丈夫です。',l:'次の月へ',f:()=>{hideModal();onCmd('next');}});
  return out.slice(0,3);
}

/* ================= 内政（レベル制） ================= */
function catEffect(k,c){const rb=roleBonus(k.id);const m=1+rb/100;
  if(k.id==='order')return `民忠＋${Math.round(10*m)}・内通が起きにくくなる`;
  return k.eff+(rb?`（奉行で＋${rb}%）`:'');}
function doUpgrade(c,cat){
  const lv=c.lv[cat];const cost=LV_COST[lv];const m=1+roleBonus(cat)/100;const P=FA(PLAYER);
  P.gold-=cost;useAP();c.lv[cat]=lv+1;
  if(cat==='agri'){const inc=Math.max(3,Math.round(c.b.agri*0.1*m));c.agriMax+=inc;c.agri=Math.min(c.agriMax,c.agri+inc);c.flood=Math.min(100,c.flood+12);}
  if(cat==='comm'){const inc=Math.max(3,Math.round(c.b.comm*0.1*m));c.commMax+=inc;c.comm=Math.min(c.commMax,c.comm+inc);c.road=Math.min(100,c.road+10);}
  if(cat==='castle'){const inc=Math.max(5,Math.round(c.b.def*0.1*m));c.maxDef+=inc;c.def=c.maxDef;c.popMax+=1500;}
  if(cat==='order'){c.loy=Math.min(100,c.loy+Math.round(10*m));}
}

     <div class="rl">${h?faceHTML(h.id,'xs'):''}${r.name}：${h?`${h.name}（＋${rb}%）`:'不在（任命すると効果アップ）'}</div>

  const tactic=(document.querySelector('input[name=tac]:checked')||{}).value||'normal';const ask=$('#aA')?$('#aA').checked:false;

  go();
}

function officerModal(id){
  const o=OF(id);const P=FA(PLAYER);const a=ageOf(o);const isL=P.leader===id;const mine=o.fac===PLAYER;const away=o.away&&o.away>now();
  const bar=(l,v,c)=>`<div><span style="font-size:13px;color:var(--ink2)">${l} <b style="color:var(--ink);font-size:15px">${v}</b></span><div class="bar"><i style="width:${v}%;${c?'background:'+c:''}"></i></div></div>`;
  let body=`<div class="evtext" style="margin-bottom:6px"><b style="font-size:21px">${o.name}</b>　<span class="badge role">${officerTitle(o)}</span><br><small>${esc(o.note)}</small></div>
   <div class="kv"><div><span>年齢（数え）</span><b>${a||'不詳'}${o.bu?'<small>※</small>':''}</b></div><div><span>役職</span><b>${officerTitle(o)}</b></div><div><span>居城</span><b>${o.castle&&CS(o.castle)?CS(o.castle).name:'—'}</b></div></div>`;
  if(!o.kin)body+=`<div class="bars2">${bar('統率',o.lea)}${bar('武勇',o.war)}${bar('知略',o.int)}${bar('政治',o.pol)}${bar('忠誠',Math.round(o.loy),o.loy<40?'var(--bad)':'var(--good)')}${bar('野心',o.amb,'var(--ink2)')}</div>
   <div class="note">統率：合戦の強さ／武勇：合戦の打撃力／知略：奇襲・調略・外交／政治：内政・奉行の効果</div>`;
  body+=`<div class="sec" style="margin-top:10px"><h3>この武将にできること</h3><div class="can" id="can"></div></div>`;
  modal('武将',body,[{label:'家臣一覧へ',on:jinjiModal}]);
  const can=[];
  if(o.kin)can.push(['一門のため役職には就かない。家の結びつきを保つ存在。',null]);
  else if(mine){
    if(away)can.push(['現在は不在（小田原参陣中など）。戻るまで行動できない。',null]);
    can.push(['合戦の大将として出陣させる（行動1回）',()=>gunjiModal('attack',{gen:id}),G.ap<=0||away]);
    can.push(['使者として外交に向かわせる（行動1回）',()=>{UI.env=id;gaikoModal();},G.ap<=0||away]);
    if(!isL){
      const ra=ROLES.map(r=>({r,b:roleBonusFor(r.id,o)})).sort((x,y)=>y.b-x.b)[0];
      can.push([`奉行に任命する（向いているのは${ra.r.name}：＋${ra.b}%）`,()=>roleForOfficer(id)]);
      if(roleOf(id))can.push([`${roleOf(id).name}の役職を解く`,()=>{for(const k in G.roles)if(G.roles[k]===id)delete G.roles[k];autosave(true);renderAll();officerModal(id);}]);
      can.push([`褒美を与える（金100・忠誠が上がる）`,()=>{P.gold-=100;const v=Math.round(8+(60-o.amb)/10);o.loy=clamp(o.loy+v,0,100);o.lastReward=now();autosave(true);toast(`${o.name}の忠誠 +${v}`);renderAll();officerModal(id);},P.gold<100]);
      can.push(['城主に任命する（城が自然に発展し、忠誠も上がる）',()=>govForOfficer(id)]);
    }
  }else if(o.fac==='ronin'){
    const pr=clamp(0.25+G.prestige/200,0.05,0.85);
    can.push([`登用する（金100・成功率 約${Math.round(pr*100)}%）`,()=>{P.gold-=100;o.tried=now();if(Math.random()<pr){o.fac=PLAYER;o.loy=55;o.castle=capitalOf(PLAYER);o.lastReward=now();toast(`${o.name}が仕官した`);}else toast(`${o.name}は仕官を断った`);autosave(true);renderAll();officerModal(id);},P.gold<100||o.tried===now()]);
  }
  $('#can').innerHTML=can.map((c,i)=>c[1]?`<button class="btn" data-i="${i}" ${c[2]?'disabled':''}>${c[0]}</button>`:`<div class="note">${c[0]}</div>`).join('');
  document.querySelectorAll('#can [data-i]').forEach(b=>b.onclick=()=>can[+b.dataset.i][1]());
}
function roleForOfficer(id){

  modal(`${o.name}を奉行に`,ROLES.map(r=>{const h=G.roles[r.id]&&OF(G.roles[r.id]);return `<button class="row" data-r="${r.id}"><span class="grow"><span class="nm">${r.name}</span><div class="meta">${r.eff} <b>＋${roleBonusFor(r.id,o)}%</b>（${r.sn} ${r.stat(o)}）</div><div class="meta">現在：${h?h.name+'（＋'+roleBonus(r.id)+'%）':'不在'}</div></span></button>`;}).join(''),[{label:'戻る',on:()=>officerModal(id)}]);
